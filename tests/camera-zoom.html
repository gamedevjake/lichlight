<!DOCTYPE html>
<!-- Sharp world zoom. Integer device pixels per texel. HUD stays in SCALE space. -->
<html>
<head><meta charset="utf-8"><title>camera-zoom</title>
<style>html,body{margin:0;background:#000;color:#ccc;font:12px monospace}iframe{border:0}pre{white-space:pre-wrap}</style>
</head>
<body>
<iframe id="g" src="../index.html?v=zoom" style="width:960px;height:540px"></iframe>
<pre id="out">running</pre>
<script>
const lines = [];
const perfRows = [];
function check(name, cond, extra) {
  lines.push((cond ? 'PASS' : 'FAIL') + ' ' + name + (extra ? ' :: ' + String(extra).slice(0, 400) : ''));
}
function finish() {
  const fails = lines.filter(l => l.startsWith('FAIL')).length;
  const pre = document.getElementById('out');
  pre.textContent = lines.join('\n') + '\n\nPERF\n' + JSON.stringify(perfRows);
  document.title = (fails ? 'FAIL ' + fails : 'PASS') + ' / ' + lines.length;
}
function fetchText(url) {
  try { const x = new XMLHttpRequest(); x.open('GET', url, false); x.send(null); return x.status === 200 ? x.responseText : ''; }
  catch (e) { return ''; }
}
function raf() { return new Promise(res => setTimeout(res, 60)); }
document.getElementById('g').addEventListener('load', () => {
  run(document.getElementById('g').contentWindow).then(finish, e => {
    lines.push('FAIL harness :: ' + (e && e.stack || e));
    finish();
  });
}, { once: true });
function stripeRuns(data) {
  let ramp = 0, runs = [], cur = -1, n = 0;
  const kind = i => (data[i] < 28 && data[i + 1] < 28 && data[i + 2] < 28) ? 0 : (data[i] > 227 && data[i + 1] > 227 && data[i + 2] > 227) ? 1 : 2;
  for (let x = 0; x < data.length; x += 4) {
    const k = kind(x);
    if (k === 2) ramp++;
    if (k !== cur) { if (cur === 0 || cur === 1) runs.push(n); cur = k; n = 1; }
    else n++;
  }
  if (cur === 0 || cur === 1) runs.push(n);
  const interior = runs.slice(1, -1);
  return { ramp, interior, unique: [...new Set(interior)] };
}
function makeChecker(w) {
  const c = w.document.createElement('canvas');
  c.width = 16; c.height = 16;
  const x = c.getContext('2d');
  for (let i = 0; i < 16; i++) { x.fillStyle = i % 2 ? '#ffffff' : '#000000'; x.fillRect(i, 0, 1, 16); }
  return c;
}
function presentRuns(w, wp) {
  const src = makeChecker(w);
  const dest = w.document.createElement('canvas');
  dest.width = 16 * wp; dest.height = 16;
  const x = dest.getContext('2d');
  x.imageSmoothingEnabled = false;
  x.drawImage(src, 0, 0, dest.width, dest.height);
  return stripeRuns(x.getImageData(0, 8, dest.width, 1).data);
}
function backingRuns(w) {
  const cv = w.document.getElementById('game');
  const x = cv.getContext('2d');
  x.setTransform(1, 0, 0, 1, 0, 0);
  x.imageSmoothingEnabled = false;
  x.drawImage(makeChecker(w), 2, 2);
  return stripeRuns(x.getImageData(2, 8, 16, 1).data);
}
function reds(canvas, x, y, w, h) {
  if (!canvas || canvas.width < 2) return -1;
  const d = canvas.getContext('2d').getImageData(x, y, w, h).data;
  let n = 0;
  for (let i = 0; i < d.length; i += 4) if (d[i] > 150 && d[i] > d[i + 1] + 50 && d[i] > d[i + 2] + 50 && d[i + 3] > 200) n++;
  return n;
}
function inkHeight(layer) {
  if (!layer) return 0;
  const w = Math.min(layer.width, 280), h = Math.min(layer.height, 80);
  const d = layer.getContext('2d').getImageData(0, 0, w, h).data;
  let minY = h, maxY = 0, n = 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4;
    if (d[i + 3] > 40 && d[i] + d[i + 1] + d[i + 2] > 80) { n++; if (y < minY) minY = y; if (y > maxY) maxY = y; }
  }
  return n ? (maxY - minY + 1) : 0;
}
async function run(w) {
  const g = w.game;
  const ver = fetchText('../version.json');
  check('version stays 0.7.18', g && g.version === '0.7.18' && ver.indexOf('"0.7.18"') >= 0, (g && g.version) + ' ' + ver.slice(0, 40));
  w.__zoomDesk = true;
  g.touchMode = false;
  w.requestAnimationFrame = function () { return 0; };
  g.newGame();
  const dpr = w.devicePixelRatio || 1;
  const live = (sixth, mobAdd) => g.backingMetrics(w.innerWidth, w.innerHeight, dpr, sixth, mobAdd);

  const ref = g.backingMetrics(1920, 1080, 1, 6, null);
  check('1080p 1x is 20 by 11.25', ref.scale === 6 && ref.worldPix === 6 && ref.tilesX === 20 && ref.tilesY === 11.25, JSON.stringify(ref));
  const far = g.backingMetrics(1920, 1080, 1, 2, null);
  check('1080p far is about 60 by 34', far.worldPix === 2 && far.tilesX === 60 && Math.abs(far.tilesY - 33.75) < 0.01, JSON.stringify(far));
  check('1080p far is not 120 tiles', far.tilesX < 80, far.tilesX);
  const steps1080 = [2, 3, 4, 5, 6].map(n => g.backingMetrics(1920, 1080, 1, n, null));
  const pixSet = new Set(steps1080.map(s => s.worldPix));
  check('1080p steps are five distinct integers', pixSet.size === 5 && steps1080.every(s => s.worldPix >= 2), [...pixSet].join(','));

  for (const d of [1, 1.25, 1.5, 2, 2.625, 3]) {
    const rows = [2, 3, 4, 5, 6].map(n => g.backingMetrics(1920, 1080, d, n, null));
    const one = rows[rows.length - 1];
    const wide = rows[0];
    const distinct = new Set(rows.map(r => r.worldPix)).size === rows.filter((r, i, a) => a.findIndex(q => q.worldPix === r.worldPix) === i).length;
    check('dpr ' + d + ' 1x worldPix is SCALE', one.worldPix === one.scale && one.bw === one.vw, JSON.stringify(one));
    check('dpr ' + d + ' far stays near 60 tiles', wide.tilesX <= 64 && wide.tilesX >= 40 && wide.worldPix >= 1, 'tiles ' + wide.tilesX.toFixed(2) + ' pix ' + wide.worldPix);
    check('dpr ' + d + ' backing is finite', rows.every(r => r.bw > 0 && r.bh > 0 && r.worldPix >= 1 && r.devW > 0), rows.map(r => r.worldPix).join(','));
    void distinct;
    const phone = [0, 1, 2, 3].map(a => g.backingMetrics(412, 915, d, null, a));
    const phonePix = new Set(phone.map(p => p.worldPix));
    check('phone dpr ' + d + ' zoom-in steps distinct', phonePix.size === 4 && phone[0].worldPix === phone[0].scale && phone[3].worldPix === phone[0].scale + 3, [...phonePix].join(','));
    for (const row of rows) {
      const pr = presentRuns(w, row.worldPix);
      const ok = pr.ramp === 0 && pr.unique.length === 1 && pr.unique[0] === row.worldPix;
      check('sharp dpr ' + d + ' pix ' + row.worldPix, ok, 'ramp ' + pr.ramp + ' runs ' + pr.interior.slice(0, 8).join(','));
    }
  }

  g.setZoom(1);
  w.render();
  check('1x backing is VW by VH', w.document.getElementById('game').width === g.vw && w.document.getElementById('game').height === g.vh, g.vw + 'x' + g.vh);
  check('1x smoothing off', w.document.getElementById('game').getContext('2d').imageSmoothingEnabled === false);
  const textAt1 = g.textPix718();
  const scaleAt1 = live(6, null).scale;
  check('1x text pixel scale is SCALE', Math.abs(textAt1 - scaleAt1) < 0.05, textAt1 + ' vs ' + scaleAt1);
  const joy0 = null, atk0 = null;

  function camRead() { return g.viewOrigin(); }
  for (let i = 0; i < 30; i++) g.step(0.05, { x: 0, y: 0 });
  const px0 = g.player.x;
  const c0 = camRead();
  g.player.x = px0 + 80;
  g.step(0.05, { x: 0, y: 0 });
  const c1 = camRead();
  const moved1 = c1.x - c0.x;
  check('1x camera lerps', moved1 > 15 && moved1 < 55, 'dx ' + moved1 + ' player ' + (g.player.x - px0));

  g.addTrauma(1);
  const sh = g.shakeOffset();
  const shaken = g.viewOrigin();
  check('1x shake moves the view', Math.hypot(sh.x, sh.y) > 0.2 && (shaken.x !== c1.x || shaken.y !== c1.y), JSON.stringify(sh));
  for (let i = 0; i < 24; i++) g.step(0.05, { x: 0, y: 0 });

  const reach = g.weaponReach713();
  function clearFoes() { const list = g.enemies; for (let i = list.length - 1; i >= 0; i--) list.splice(i, 1); }
  function placeFoe(dist) {
    clearFoes();
    const p = g.player;
    p.fx = 1; p.fy = 0; p.atkCd = 0; p.swing = 0;
    const e = w.spawnEnemy(g.MOB_IDS[0], p.x + dist, p.y);
    e.x = p.x + dist; e.y = p.y;
    return e;
  }
  function swingAt(dist) {
    const e = placeFoe(dist);
    const hp = e.hp;
    w.doAttack(true);
    return { hit: e.hp < hp, d: Math.hypot(e.x - g.player.x, e.y - g.player.y), r: e.r, hp: e.hp, was: hp };
  }
  const hit1 = swingAt(Math.max(4, reach - 2));
  const miss1 = swingAt(reach + 14);
  check('1x melee connects inside reach', hit1.hit, JSON.stringify(hit1));
  check('1x melee misses past reach', !miss1.hit, JSON.stringify(miss1));

  function torchR() {
    const L = g.playerLights();
    let best = 0;
    for (const l of L) if (l.r > best) best = l.r;
    return Math.round(best * 100) / 100;
  }
  g.player.torchT = 80;
  g.setZoom(1);
  const torch1 = torchR();
  g.setZoom(g.zoomSteps()[0]);
  const torchWide = torchR();
  g.setZoom(1);
  check('torch world radius unchanged', torch1 > 10 && torch1 === torchWide, torch1 + ' -> ' + torchWide);

  const steps = g.zoomSteps();
  check('desktop steps include 1x and a wide step', steps.indexOf(1) === steps.length - 1 && steps.length >= 2 && steps[0] < 1, steps.join(','));
  const seenPix = new Set();
  for (let i = 0; i < steps.length; i++) {
    g.setZoom(steps[i]);
    const wp = g.worldPix();
    seenPix.add(wp);
    w.render();
    const cv = w.document.getElementById('game');
    const expect = live(g.zoomSixth, null);
    check('step ' + g.zoomLabel() + ' backing', cv.width === expect.bw && cv.height === expect.bh && wp === expect.worldPix, cv.width + 'x' + cv.height + ' pix ' + wp);
    const back = backingRuns(w);
    const pres = presentRuns(w, wp);
    check('step ' + g.zoomLabel() + ' world stripes', back.ramp === 0 && back.unique.length === 1 && back.unique[0] === 1, JSON.stringify(back.interior.slice(0, 6)));
    check('step ' + g.zoomLabel() + ' present stripes', pres.ramp === 0 && pres.unique.length === 1 && pres.unique[0] === wp, JSON.stringify(pres));
    const samples = [];
    for (let n = 0; n < 24; n++) {
      const t0 = performance.now();
      w.render();
      samples.push(performance.now() - t0);
    }
    samples.sort((a, b) => a - b);
    const avg = samples.reduce((s, v) => s + v, 0) / samples.length;
    const p95 = samples[Math.min(samples.length - 1, Math.ceil(samples.length * 0.95) - 1)];
    const light = g.lcan;
    const text = g.textLayer;
    const hud = g.hudLayer;
    const mem = cv.width * cv.height * 4 + (light ? light.width * light.height * 4 : 0) + (text ? text.width * text.height * 4 : 0) + (hud && hud.style.display !== 'none' ? hud.width * hud.height * 4 : 0);
    perfRows.push({ mode: 'desk', label: g.zoomLabel(), worldPix: wp, backing: cv.width + 'x' + cv.height, light: light ? (light.width + 'x' + light.height) : '0', avg: +avg.toFixed(2), p95: +p95.toFixed(2), mem: mem });
    check('step ' + g.zoomLabel() + ' render finite', avg < 250 && p95 < 400, 'avg ' + avg.toFixed(1));
  }
  check('live desktop steps distinct', seenPix.size === steps.length, [...seenPix].join(','));

  g.setZoom(steps[0]);
  for (let i = 0; i < 20; i++) g.step(0.05, { x: 0, y: 0 });
  const f0 = camRead();
  const fpx = g.player.x;
  g.player.x = fpx + 80;
  g.step(0.05, { x: 0, y: 0 });
  const f1 = camRead();
  const movedF = f1.x - f0.x;
  check('zoomed camera still lerps', movedF > 15 && movedF < 55 && Math.abs(movedF - moved1) < 20, 'far ' + movedF + ' 1x ' + moved1);
  g.addTrauma(1);
  const shF = g.shakeOffset();
  const originF = g.viewOrigin();
  check('zoomed shake moves the view', Math.hypot(shF.x, shF.y) > 0.2 && (originF.x !== f1.x || originF.y !== f1.y), JSON.stringify(shF));
  for (let i = 0; i < 24; i++) g.step(0.05, { x: 0, y: 0 });

  const hitZ = swingAt(Math.max(4, reach - 2));
  const missZ = swingAt(reach + 14);
  check('zoomed melee connects at the same reach', hitZ.hit, JSON.stringify(hitZ));
  check('zoomed melee still misses past reach', !missZ.hit, JSON.stringify(missZ));

  function arrowHit() {
    clearFoes();
    g.projs.length = 0;
    const p = g.player;
    const e = w.spawnEnemy(g.MOB_IDS[0], p.x + 48, p.y);
    e.x = p.x + 48; e.y = p.y; e.r = e.r || 6;
    const hp = e.hp;
    g.projs.push({ x: e.x - e.r - 1, y: e.y, vx: 180, vy: 0, r: 3, dmg: 5, owner: 'p', kind: 'arrow', life: 1, visualStyle: null });
    g.step(0.016, { x: 0, y: 0 });
    g.projs.length = 0;
    return e.hp < hp;
  }
  g.setZoom(1);
  const arrow1 = arrowHit();
  g.setZoom(steps[0]);
  const arrowZ = arrowHit();
  check('arrow hit does not depend on zoom', arrow1 === arrowZ, '1x ' + arrow1 + ' zoom ' + arrowZ);

  g.setZoom(steps[0]);
  g.player.torchT = 0;
  if (g.glLook) { g.glLook().envB = 0; }
  w.render();
  const V = g.lightFrame;
  check('wide frustum covers the backing', !!(V && Math.abs(V.w - g.viewWorldSize().w) < 1.5 && V.w > g.vw), V && (Math.round(V.w) + 'x' + Math.round(V.h)));
  let dark = null, seen = null;
  if (V) {
    const x0 = Math.floor(V.x / 16), y0 = Math.floor(V.y / 16), x1 = Math.floor((V.x + V.w) / 16), y1 = Math.floor((V.y + V.h) / 16);
    for (let ty = y0; ty <= y1 && !dark; ty++) for (let tx = x0; tx <= x1; tx++) {
      if (w.tileAt(tx, ty) !== 1 || g.seenAt(tx, ty)) continue;
      const wx = (tx + 0.5) * 16, wy = (ty + 0.5) * 16;
      if (Math.hypot(wx - g.player.x, wy - g.player.y) < 80) continue;
      const s = g.lightSample(wx, wy);
      if (s && s[0] + s[1] + s[2] < 80) { dark = { tx, ty, s }; break; }
    }
    if (dark) {
      g.seeTile(dark.tx, dark.ty);
      if (g.glLook) { g.glLook().seenR = 0; g.glLook().seenG = 220; g.glLook().seenB = 40; }
      w.render();
      seen = g.lightSample((dark.tx + 0.5) * 16, (dark.ty + 0.5) * 16);
    }
  }
  check('unexplored tile stays dark when zoomed out', !!dark, dark && dark.s.join(','));
  check('remembered tile is not the same black', !!(seen && seen[1] > (dark ? dark.s[1] : 0) + 40), seen && seen.join(','));

  if (g.glLookReset) g.glLookReset();
  g.player.torchT = 90;
  function sumPx(px) { return px ? px[0] + px[1] + px[2] : -1; }
  function farUnseen() {
    const V = g.lightFrame;
    if (!V) return null;
    const x0 = Math.floor(V.x / 16), y0 = Math.floor(V.y / 16);
    const x1 = Math.floor((V.x + V.w) / 16), y1 = Math.floor((V.y + V.h) / 16);
    let best = null;
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
      if (w.tileAt(tx, ty) !== 1 || g.seenAt(tx, ty)) continue;
      const wx = (tx + 0.5) * 16, wy = (ty + 0.5) * 16;
      if (Math.hypot(wx - g.player.x, wy - g.player.y) < 140) continue;
      const s = g.lightSample(wx, wy);
      if (!s) continue;
      const sum = sumPx(s);
      if (!best || sum < best.sum) best = { sum: sum, s: s, tx: tx, ty: ty, wx: wx, wy: wy };
    }
    return best;
  }
  function lightProbe(tag) {
    w.render();
    const near = g.lightSample(g.player.x, g.player.y - 2);
    const far = farUnseen();
    const bw = w.document.getElementById('game').width;
    const lq = g.lightScale();
    check(tag + ' torch bright', sumPx(near) > 80, sumPx(near) + ' ' + g.lightPath());
    check(tag + ' unexplored dark', !!(far && far.sum < 80), far && (far.sum + ' @' + far.tx + ',' + far.ty));
    if (g.lightPath() === 'canvas') {
      const expectW = Math.max(1, Math.ceil(bw * lq));
      check(tag + ' lightmap matches quality', Math.abs(g.lcan.width - expectW) <= 1, g.lcan.width + ' vs ' + expectW + ' q ' + lq);
    } else check(tag + ' lightmap matches quality', g.lightPath() === 'webgl', g.lightPath());
  }
  const prevLight = g.settings.lighting, prevGl = g.settings.glLight;
  g.settings.lighting = 'low';
  g.settings.glLight = 'off';
  g.setZoom(1);
  lightProbe('low 1x');
  g.setZoom(steps[0]);
  lightProbe('low far');
  g.settings.lighting = 'high';
  g.settings.glLight = 'on';
  g.setZoom(1);
  w.render();
  const gl1 = g.glStatus ? g.glStatus() : null;
  check('gl 1x path', g.lightPath() === 'webgl', (gl1 && gl1.reason) || g.lightPath());
  if (g.lightPath() === 'webgl') lightProbe('gl 1x');
  g.setZoom(steps[0]);
  w.render();
  const glF = g.glStatus ? g.glStatus() : null;
  check('gl far path', g.lightPath() === 'webgl', (glF && glF.reason) || g.lightPath());
  if (g.lightPath() === 'webgl') lightProbe('gl far');
  g.settings.lighting = prevLight || 'high';
  g.settings.glLight = prevGl || 'off';
  if (g.glLookReset) g.glLookReset();
  g.setZoom(1);

  // 125% Windows: CSS 1536x864 at DPR 1.25 is 1920x1080 device pixels, so SCALE and the
  // integer steps match the 1080p DPR 1 reference (far step stays 60 x 33.75, not ~75).
  const win1 = g.backingMetrics(1536, 864, 1.25, 6, null);
  const winFar = g.backingMetrics(1536, 864, 1.25, 2, null);
  const winSteps = [2, 3, 4, 5, 6].map(n => g.backingMetrics(1536, 864, 1.25, n, null).worldPix);
  check('dpr 1.25 at 1536x864 matches 1080p', win1.scale === 6 && win1.vw === 320 && win1.vh === 180 && win1.worldPix === 6 && win1.bw === 320 && win1.bh === 180, JSON.stringify(win1));
  check('dpr 1.25 at 1536x864 far is 60 tiles', winFar.worldPix === 2 && winFar.tilesX === 60 && Math.abs(winFar.tilesY - 33.75) < 0.01 && winFar.bw === 960 && winFar.bh === 540, JSON.stringify(winFar));
  check('dpr 1.25 at 1536x864 steps stay distinct', winSteps.join(',') === '2,3,4,5,6', winSteps.join(','));

  function aim(wx, wy) {
    const s = g.worldToScreen(wx, wy);
    const v = g.viewWorldSize();
    if (g.zoom === 1) { g.mouse.x = s.x; g.mouse.y = s.y; }
    else { g.mouse.x = s.x / v.w * g.vw; g.mouse.y = s.y / v.h * g.vh; }
    return g.cursorWorld();
  }
  function tileCenter() {
    const p = g.player;
    const bx = Math.floor(p.x / 16), by = Math.floor(p.y / 16);
    for (let r = 1; r <= 4; r++) for (let ty = by - r; ty <= by + r; ty++) for (let tx = bx - r; tx <= bx + r; tx++) {
      if (tx === bx && ty === by) continue;
      if (!g.walkable(tx, ty)) continue;
      g.seeTile(tx, ty);
      return { tx, ty, x: (tx + 0.5) * 16, y: (ty + 0.5) * 16 };
    }
    return { tx: bx, ty: by, x: (bx + 0.5) * 16, y: (by + 0.5) * 16 };
  }
  function standOpen() {
    const p = g.player;
    for (let ty = 2; ty < 48; ty++) for (let tx = 2; tx < 48; tx++) {
      if (!g.walkable(tx, ty) || !g.walkable(tx + 1, ty)) continue;
      p.x = (tx + 0.5) * 16; p.y = (ty + 0.5) * 16; p.walk = null;
      g.seeTile(tx, ty); g.seeTile(tx + 1, ty);
      return { tx: tx + 1, ty, x: (tx + 1.5) * 16, y: (ty + 0.5) * 16 };
    }
    return tileCenter();
  }
  for (const z of [1, steps[0]]) {
    g.setZoom(z);
    w.render();
    const t = standOpen();
    const got = aim(t.x, t.y);
    const dx = Math.abs(got.x - t.x), dy = Math.abs(got.y - t.y);
    check('aim ' + g.zoomLabel() + ' within a texel', dx < 1 && dy < 1, dx.toFixed(3) + ',' + dy.toFixed(3));
    const walked = g.groundWalk(got.x, got.y, false);
    const walk = g.walk;
    const wtx = walk ? Math.floor(walk.x / 16) : -1, wty = walk ? Math.floor(walk.y / 16) : -1;
    const path = g.planWalk(t.x, t.y, true);
    check('walk ' + g.zoomLabel() + ' targets that tile', walked === true && wtx === t.tx && wty === t.ty, 'walked ' + walked + ' tile ' + wtx + ',' + wty + ' vs ' + t.tx + ',' + t.ty + ' path ' + (path && path.length) + ' seen ' + g.seenAt(t.tx, t.ty));
  }

  const frame = document.getElementById('g');
  frame.style.width = '800px';
  frame.style.height = '600px';
  await raf();
  w.resize();
  g.setZoom(g.zoomSteps()[0]);
  w.render();
  check('smoothing off after resize', w.document.getElementById('game').getContext('2d').imageSmoothingEnabled === false);
  const t2 = tileCenter();
  const got2 = aim(t2.x, t2.y);
  check('aim after resize within a texel', Math.abs(got2.x - t2.x) < 1 && Math.abs(got2.y - t2.y) < 1, Math.abs(got2.x - t2.x).toFixed(3));
  frame.style.width = '960px';
  frame.style.height = '540px';
  await raf();
  w.resize();

  function mapPatch(canvas) {
    if (!canvas) return { sig: '', ink: 0 };
    const mw = Math.min(canvas.width, Math.floor(canvas.width * 0.3)), mh = Math.min(canvas.height, Math.floor(canvas.height * 0.35));
    const x0 = Math.max(0, canvas.width - mw);
    const d = canvas.getContext('2d').getImageData(x0, 0, mw, mh).data;
    let sig = '', ink = 0;
    for (let i = 0; i < d.length; i += 4) {
      const s = d[i] + d[i + 1] + d[i + 2];
      if (s > 24 && d[i + 3] > 20) ink++;
      if (i % 64 === 0) sig += (s >> 5).toString(16);
    }
    return { sig, ink };
  }
  g.setZoom(1);
  if (typeof w.syncDesk === 'function') w.syncDesk();
  w.render();
  const map1 = mapPatch(w.document.getElementById('game'));
  const desk = w.document.getElementById('deskHud');
  const desk1 = desk.getBoundingClientRect();
  g.setZoom(g.zoomSteps()[0]);
  if (typeof w.syncDesk === 'function') w.syncDesk();
  w.render();
  const mapZ = mapPatch(g.hudLayer);
  const deskZ = desk.getBoundingClientRect();
  const cssW = parseFloat(w.document.getElementById('game').style.width) || 0;
  const devPerLogical = (cssW * dpr) / g.vw;
  check('minimap drawn at 1x and zoom', map1.ink >= 4 && mapZ.ink >= 4, map1.ink + '/' + mapZ.ink);
  check('HUD device scale stays SCALE', g.hudLayer && g.hudLayer.width === g.vw && g.hudLayer.height === g.vh && Math.abs(devPerLogical - scaleAt1) < 0.25, devPerLogical.toFixed(3) + ' vs ' + scaleAt1 + ' hud ' + (g.hudLayer && g.hudLayer.width));
  check('desktop bar size independent of zoom', Math.abs(desk1.width - deskZ.width) < 1.5 && Math.abs(desk1.height - deskZ.height) < 1.5 && desk1.width > 50, Math.round(desk1.width) + 'x' + Math.round(desk1.height) + ' -> ' + Math.round(deskZ.width) + 'x' + Math.round(deskZ.height));
  const textFar = inkHeight(g.textLayer);
  const text1 = inkHeight(g.textLayer);
  g.setZoom(1);
  w.render();
  const text1b = inkHeight(g.textLayer);
  check('HUD text does not jump with zoom', text1b > 4 && textFar > 0 && textFar < text1b * 2.2, 'far ' + textFar + ' 1x ' + text1b + ' mid ' + text1);
  const face = Math.round(6 * g.worldPix());
  const blown = Math.round(6 * scaleAt1 * g.worldPix());
  check('world text scale is not applied twice', face < blown, face + ' vs ' + blown);

  g.touchMode = true;
  delete w.__zoomDesk;
  g.setZoom(1);
  w.resize();
  const joyA = w.document.getElementById('joybase').getBoundingClientRect();
  const atkA = w.document.getElementById('bAtk').getBoundingClientRect();
  const mob = g.zoomSteps();
  const mobPix = [];
  for (const s of mob) { g.setZoom(s); mobPix.push(g.worldPix()); w.render(); }
  check('touch steps zoom in by whole pixels', mobPix.length >= 2 && mobPix[0] === (live(null, 0).scale) && new Set(mobPix).size === mobPix.length && mobPix[mobPix.length - 1] > mobPix[0], mobPix.join(','));
  const joyB = w.document.getElementById('joybase').getBoundingClientRect();
  const atkB = w.document.getElementById('bAtk').getBoundingClientRect();
  check('joystick stays put', joyA.width > 20 && Math.abs(joyA.left - joyB.left) < 1 && Math.abs(joyA.top - joyB.top) < 1, Math.round(joyA.left) + ',' + Math.round(joyB.left));
  check('touch button stays put', atkA.width > 20 && Math.abs(atkA.left - atkB.left) < 1 && Math.abs(atkA.top - atkB.top) < 1, Math.round(atkA.left) + ',' + Math.round(atkB.left));
  w.__zoomDesk = true;
  g.touchMode = false;
  g.setZoom(steps[0]);
  const gold = 4242;
  g.player.gold = gold;
  const spot = standOpen();
  const px = Math.round(g.player.x), py = Math.round(g.player.y);
  const pots = g.player.hpPot;
  void spot;
  w.dispatchEvent(new Event('pagehide'));
  const raw = w.localStorage.getItem('cryptdelve') || '';
  const settings = w.localStorage.getItem('cryptdelve-settings') || '';
  check('save has no zoom field', raw.indexOf('"zoom"') < 0 && raw.indexOf('zoomSixth') < 0, raw.slice(0, 80));
  check('settings have no zoom key', settings.indexOf('zoom') < 0, settings.slice(0, 120));
  await new Promise(res => {
    frame.addEventListener('load', () => res(), { once: true });
    frame.src = frame.src;
  });
  const w2 = frame.contentWindow;
  const g2 = w2.game;
  w2.requestAnimationFrame = function () { return 0; };
  check('reload boots at 1x', g2.zoom === 1 && g2.worldPix() === (w2.devicePixelRatio ? g2.backingMetrics(w2.innerWidth, w2.innerHeight, w2.devicePixelRatio || 1, 6, null).scale : g2.worldPix()), g2.zoomLabel());
  g2.continueGame();
  check('reload keeps gold and place', g2.player && g2.player.gold === gold && Math.round(g2.player.x) === px && Math.round(g2.player.y) === py && g2.player.hpPot === pots, (g2.player && g2.player.gold) + ' @' + (g2.player && Math.round(g2.player.x)));
  check('reload zoom still 1x', g2.zoom === 1, g2.zoomLabel());
}
</script>
</body>
