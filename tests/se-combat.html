  function kit(d, kind) {
    const L = d;
    if (kind === 'under') return [forge('Rusty Sword', 1, 0, null)];
    const items = [];
    if (kind === 'bow') items.push(forge('Short Bow', L, 2, { dmg: med(1, 2 + L), ias: med(5, 10 + L * 2), crit: med(3, 6 + L) }));
    else if (kind === 'caster') items.push(forge(best('weapon', d, 'staff').name, L, 2, { fire: med(2, 4 + L * 2), ias: med(5, 10 + L * 2) }));
    else items.push(forge(best('weapon', d, 'sword').name, L, 2, { dmg: med(1, 2 + L), ias: med(5, 10 + L * 2), crit: med(3, 6 + L) }));
    if (kind === 'under') return items;
    const armor = best('armor', d), helm = best('helm', d), boots = best('boots', d), shield = best('shield', d), amulet = best('amulet', d);
    items.push(forge(armor.name, L, 2, { def: med(1, 2 + L), hp: med(4, 8 + L * 3) }));
    items.push(forge(helm.name, L, 2, { hp: med(4, 8 + L * 3), resFire: med(6, 8 + Math.floor(L / 2)) }));
    items.push(forge(boots.name, L, 2, { def: med(1, 2 + L), hp: Math.round(med(4, 8 + L * 3) / 2) }));
    items.push(forge(shield.name, L, 2, { def: med(1, 2 + L) }));
    items.push(forge(amulet.name, L, 2, { hp: med(4, 8 + L * 3), fire: Math.max(2, Math.round(med(2, 4 + L * 2) / 3)) }));
    if (kind === 'caster') items.push(forge('Ring', L, 2, { fire: med(2, 4 + L * 2), mp: med(4, 8 + L * 2) }));
    else if (kind !== 'bow') items.push(forge('Ring', L, 2, { dmg: med(1, 2 + L), ias: Math.max(5, Math.round(med(5, 10 + L * 2) / 2)) }));
    else items.push(forge('Ring', L, 2, { dmg: med(1, 2 + L), ias: med(5, 10 + L * 2) }));
    return items;
  }
  function actor(d) {
    g.startFloor(d, true);
    if (g.SE717) { g.SE717.dead = false; g.SE717.alive = true; }
    const e = g.seSpawn717('se_nyx', 'fight');
    e.sePhase = 'fight'; e.dead = false; e.hidden = false; e.hp = e.maxHp; e.shield = e.maxShield;
    e.x = p.x + 24; e.y = p.y; e.seStep = 0; e.seAct = ''; e.seCd = 0.6; e.spd = 0;
    w.clearStatuses(e); g.ensurePoise(e);
    e.poise = e.poiseMax; e.staggerImmune = 0;
    if (g.state !== 'play') w.setState('play');
    return e;
  }
  function place(e, build, style) {
    if (build === 'bow') {
      p.x = e.x + 140; p.y = e.y + (style === 'kite' ? 24 : 0);
    } else if (style === 'kite') {
      p.x = e.x + 28; p.y = e.y + 20;
    } else {
      p.x = e.x + 14; p.y = e.y;
    }
    p.inv0 = 0; p.roll = 0;
  }
  function strike(e, kind, build, style) {
    place(e, build, style);
    p.hp = 1e6; p.inv0 = 0;
    const row = g.SE_TELL[kind];
    let spec = null;
    if (kind === 'swing') spec = { x: e.x, y: e.y, a: 0, len: row.len, w: row.w };
    else if (kind === 'power') spec = { x: e.x, y: e.y, r: g.sePowerReach(g.depth) };
    else {
      const dodge = style === 'kite' && build === 'bow';
      spec = { x: p.x, y: dodge ? p.y + 40 : p.y, r: g.seBrandReach() };
      if (dodge) { /* the archer steps off the mark */ }
    }
    e.seAct = ''; e.sePhase = 'fight'; e.dead = false;
    const hit = g.seResolveTell(e, kind, spec);
    const dealt = Math.max(0, 1e6 - p.hp);
    p.hp = 1e6; p.inv0 = 0;
    return { hit: hit, dealt: dealt };
  }

  const depths = [3, 5, 8, 12];
  const levels = { 3: 6, 5: 9, 8: 13, 12: 20 };
  const builds = ['melee', 'bow', 'caster', 'under'];
  const proj = [];
  function fight(d, lv, kind, style) {
    setLevel(lv);
    equip(kit(d, kind));
    const e = actor(d);
    const block = p.st.block;
    p.st.block = 0;
    const cast = kind === 'caster';
    const bow = kind === 'bow';
    const period = g.attackPeriod();
    let t = 0;
    const dt = 0.05;
    const cap = 360;
    let atkCd = 0, fbCd = 0, seCd = 0.6, seStep = 0, tell = null;
    let shadow = p.st.maxHp, pots = 3, potsUsed = 0, diedAt = null, shieldAt = null, dmgIn = 0;
    const tells = { swing: 0, power: 0, brand: 0, hit: 0 };
    let critAcc = 0, baseI = 0;
    const b0 = p.st.min, b1 = Math.max(p.st.min, p.st.max);
    const pc = Math.min(1, Math.max(0, p.st.crit) / 100);
    const mul = p.st.critMul || 2;
    const shield0 = e.maxShield;
    p.mp = p.st.maxMp;
    while (e.hp > 0 && !e.dead && t < cap) {
      shadow = Math.min(p.st.maxHp, shadow + (p.st.regen || 0) * dt);
      p.mp = Math.min(p.st.maxMp, p.mp + (1.4 + p.lvl * 0.1) * dt);
      if (shadow < p.st.maxHp * 0.4 && shadow > 0 && pots > 0) {
        pots--; potsUsed++;
        shadow = Math.min(p.st.maxHp, shadow + p.st.maxHp * 0.45 + 10);
      }
      g.tickStatuses(e, dt);
      const locked = g.ccImmobilized(e);
      if (locked) tell = null;
      atkCd -= dt;
      if (atkCd <= 0 && e.hp > 0 && !e.dead) {
        const base = b0 + ((baseI++) % (b1 - b0 + 1));
        critAcc += pc;
        let roll = base, isCrit = false;
        if (critAcc >= 1) { critAcc -= 1; roll = base * mul; isCrit = true; }
        if (!bow) {
          p.hp = Math.min(shadow, p.st.maxHp);
          const info = w.leech(g.scaleAmount(roll, 'Physical', 1), 'melee');
          shadow = Math.min(p.st.maxHp, shadow + (info.healed || 0));
        }
        p.hp = 1e6;
        g.damageEnemy(e, roll, 0, 0, '#fff', isCrit, null, {
          type: 'Physical', tags: bow ? ['Ranged', 'Projectile', 'Direct'] : ['Melee', 'Direct'],
          more: 1, critApplied: true, skill: bow ? 'bow' : 'melee', scale: true,
          weaponFamily: w.weaponFamilyOf(p).id
        });
        atkCd += period;
        if (shieldAt == null && (e.shield || 0) <= 0) shieldAt = t;
      }
      if (cast) fbCd -= dt;
      if (cast && fbCd <= 0 && p.mp >= 4 && e.hp > 0 && !e.dead) {
        p.mp -= 4; fbCd += 0.45;
        p.hp = 1e6;
        const pw = p.st.fire + p.lvl * 2;
        const amp = 1 + w.skillAmp(0) / 100;
        g.damageEnemy(e, (8 + pw * 1.4) * amp, 0, 0, '#ffa030', false, null, {
          type: 'Fire', tags: ['Spell', 'Projectile'], critApplied: true, skill: 'fireball', scale: true
        });
        w.igniteFromSkill(e, pw, 1, g.skillBuild(0));
        if (shieldAt == null && (e.shield || 0) <= 0) shieldAt = t;
      }
      if (e.hp <= 0 || e.dead) break;
      if (tell) {
        tell.t += dt;
        if (tell.t >= tell.dur - 1e-6) {
          const res = locked ? { hit: 0, dealt: 0 } : strike(e, tell.kind, kind, style);
          tells[tell.kind]++;
          if (res.hit) { tells.hit++; dmgIn += res.dealt; shadow -= res.dealt; }
          if (shadow <= 0 && diedAt == null) diedAt = t;
          seCd = g.SE_TELL[tell.kind].gap;
          tell = null;
        }
      } else if (!locked) {
        seCd -= dt;
        if (seCd <= 0) {
          e.seStep = seStep;
          const next = g.seNextKind(e);
          seStep = (seStep + 1) % 6;
          e.seStep = seStep;
          tell = { kind: next, t: 0, dur: g.SE_TELL[next].dur };
        }
      }
      t += dt;
    }
    const done = e.hp <= 0 || e.dead;
    return {
      depth: d, build: kind, style: style, weapon: (p.equip.weapon && p.equip.weapon.name) || 'fists',
      life: p.st.maxHp, def: p.st.def, block: block,
      seHp: e.maxHp, seShield: shield0,
      ttk: done ? r1(t) : null, capped: !done,
      dmgIn: r1(dmgIn), diedAt: diedAt == null ? null : r1(diedAt), pots: potsUsed,
      tells: tells.swing + '/' + tells.power + '/' + tells.brand
    };
  }
  for (const d of depths) {
    for (const b of builds) {
      for (const style of ['stand', 'kite']) proj.push(fight(d, levels[d], b, style));
    }
  }
  const strong = proj.filter(r => r.depth === 5 && (r.build === 'melee' || r.build === 'bow' || r.build === 'caster') && r.style === 'stand');
  const short = strong.filter(r => r.ttk != null && r.ttk < 15);
  check('projection ran for every build and depth', proj.length === 32 && proj.every(r => r.seHp === g.seMaxHp717(r.depth)), proj.length);
  check('depth 5 life is still 194 after the projection', g.seMaxHp717(5) === 194 && g.seMaxHp717(12) === 1172);
  const body = proj.map(r => 'PROJ d' + r.depth + ' ' + r.build + ' ' + r.style + ' ttk=' + (r.ttk == null ? 'capped' : r.ttk) + 's in=' + r.dmgIn + ' pots=' + r.pots + ' died=' + (r.diedAt == null ? 'no' : r.diedAt + 's') + ' tells=' + r.tells + ' hp=' + r.seHp + ' plife=' + r.life + ' ' + r.weapon).join('\n');
  const note = 'BALANCE depth5-stand-under-15s ' + short.map(r => r.build + '=' + r.ttk + 's').join(',') + (short.length ? ' more-balance-work-needed hp-not-raised' : ' within-15s');
  lines.push('PASS ' + note);
  finish('\n' + body + '\n' + note);
}
</script>
