}
function hits(pool, dealt) { return dealt > 0 ? Math.ceil(pool / dealt) : 999; }
function bleedSim(hp, hit, period) {
  // Swing at the end of each period. A 1-damage unscaled bleed stack ticks on each whole second it is still up.
  let left = hp, t = 0, nextTick = 1, stacks = [], guard = 0;
  while (left > 0 && guard++ < 5000) {
    const swingAt = t + period;
    while (nextTick <= swingAt + 1e-9 && left > 0) {
      if (stacks.length) left -= stacks.length;
      for (let i = stacks.length - 1; i >= 0; i--) {
        stacks[i] -= 1;
        if (stacks[i] <= 0) stacks.splice(i, 1);
      }
      if (left <= 0) return Math.round(nextTick * 1000) / 1000;
      nextTick += 1;
    }
    t = swingAt;
    left -= hit;
    if (left <= 0) return Math.round(t * 1000) / 1000;
    stacks.push(4);
    if (stacks.length > 5) stacks.shift();
  }
  return Math.round(t * 1000) / 1000;

  for (let n = 0; n < 4 && floorStable; n++) {
    w.save();
    g.continueGame();
    const m2 = (g.ground || []).map(o => o && o.item).find(it => it && it.id === 501);
    const u2 = (g.chests || []).map(c => c && c.item).find(it => it && it.id === 502);
    if (!m2 || !u2 || snap(m2) !== mailSig || snap(u2) !== lidSig) floorStable = false;
  }
  check('floor items stay put across further loads', floorStable);

  const migHits = [];
  [[3, 'mage', 'Shadow'], [12, 'siren', 'Cold'], [14, 'exarch', 'Shadow'], [15, 'seer', 'Lightning']].forEach(spec => {
    const ilvl = spec[0] + 1;
    const legacy = {
      armor: { id: 801, slot: 'armor', icon: 'armor', base: 'Leather Armor', name: 'Leather Armor', rarity: 0, lvl: ilvl, def: 3 + Math.floor(ilvl / 3), mods: {}, maxDur: 40, dur: 40 },
      helm: { id: 802, slot: 'helm', icon: 'helm', base: 'Cap', name: 'Cap', rarity: 0, lvl: ilvl, def: 1 + Math.floor(ilvl / 3), mods: {}, maxDur: 30, dur: 30 },
      boots: { id: 803, slot: 'boots', icon: 'boots', base: 'Boots', name: 'Boots', rarity: 0, lvl: ilvl, def: 1 + Math.floor(ilvl / 3), mods: {}, maxDur: 26, dur: 26 },
      shield: { id: 804, slot: 'shield', icon: 'shield', base: 'Wooden Buckler', name: 'Wooden Buckler', rarity: 0, lvl: ilvl, def: 2 + Math.floor(ilvl / 3), block: 8, mods: {}, maxDur: 44, dur: 44 }
    };
    w.localStorage.setItem('cryptdelve', JSON.stringify({
      depth: spec[0], itemId: 900,
      p: { lvl: spec[0], xp: 0, gold: 0, hp: 80, mp: 20, learned: [true, true, true], skillSpec: ['base', 'base', 'base'], inv: [], equip: { weapon: null, shield: legacy.shield, helm: legacy.helm, armor: legacy.armor, boots: legacy.boots, ring: null, amulet: null } }
    }));
    g.continueGame();
    const pp = g.player;
    pp.inv0 = 0; pp.roll = 0; pp.st.block = 0; w.__hurtSpread = 1; w.__champCrit = 1;
    const e = g.spawnEnemy(spec[1], pp.x + 80, pp.y, false);
    const pr = w.eShoot(e, 0, 90, spec[1] === 'siren' ? { kind: 'water', mul: 0.7 } : spec[1] === 'seer' ? { kind: 'snipe', mul: 1.2 } : spec[1] === 'exarch' ? { kind: 'orb' } : {});
    const amount = pr.dmg;
    w.computeStats();
    pp.st.block = 0; pp.hp = 400; pp.inv0 = 0; pp.roll = 0;
    w.hurtPlayer(amount, pr);
    const migrated = w.__lastDamage.dealt;
    const migRes = pp.st.resShadow;
    const migDef = pp.st.def;
    const freshArmor = g.makeItem(ilvl, 0, 'Leather Armor');
    const freshHelm = g.makeItem(ilvl, 0, 'Cap');
    const freshBoots = g.makeItem(ilvl, 0, 'Boots');
    const freshShield = g.makeItem(ilvl, 0, 'Wooden Buckler');
    const sameMods = freshArmor.mods.resAll === pp.equip.armor.mods.resAll && freshHelm.mods.resAll === pp.equip.helm.mods.resAll && freshBoots.mods.resAll === pp.equip.boots.mods.resAll && freshShield.mods.resAll === pp.equip.shield.mods.resAll && freshArmor.def === pp.equip.armor.def;
    pp.equip.armor = freshArmor; pp.equip.helm = freshHelm; pp.equip.boots = freshBoots; pp.equip.shield = freshShield;
    w.computeStats();
    pp.st.block = 0; pp.hp = 400; pp.inv0 = 0; pp.roll = 0;
    w.hurtPlayer(amount, pr);
    const freshDealt = w.__lastDamage.dealt;
    pp.equip.armor = null; pp.equip.helm = null; pp.equip.boots = null; pp.equip.shield = null;
    w.computeStats();
    pp.st.def = 0; pp.st.block = 0; pp.hp = 400; pp.inv0 = 0; pp.roll = 0;
    ['resFire', 'resCold', 'resLightning', 'resPoison', 'resShadow'].forEach(k => { pp.st[k] = 0; });
    w.hurtPlayer(amount, pr);
    const naked = w.__lastDamage.dealt;
    migHits.push({ id: spec[1], depth: spec[0], type: spec[2], bolt: Math.round(amount * 100) / 100, def: migDef, res: migRes, migrated: migrated, fresh: freshDealt, naked: naked, sameMods: sameMods });
  });
  const matched = migHits.length === 4 && migHits.every(r => r.sameMods && r.migrated === r.fresh && r.migrated < r.naked && r.migrated > 0);
  check('migrated whites take the same bolt as a new ward kit', matched, JSON.stringify(migHits));
  try { w.localStorage.removeItem('cryptdelve'); } catch (e) {}
}
</script>
