}
document.getElementById('g').addEventListener('load', () => {

});

}

  return out;
}

  const seer = g.spawnEnemy('seer', p.x + 90, p.y, false);
  const snipe = w.eShoot(seer, 0, 280, { kind: 'snipe', r: 2, life: 1.2, mul: 1.2 });
  const spider = g.spawnEnemy('spider', p.x + 90, p.y, false);
  const web = w.eShoot(spider, 0, 100, { kind: 'web' });
  const arch = g.spawnEnemy('archer', p.x + 90, p.y, false);
  const arrow = w.eShoot(arch, 0, 120, { kind: 'arrow' });
  p.st.def = 30; p.hp = 300; p.inv0 = 0; p.roll = 0; w.__hurtSpread = 1;
  w.hurtPlayer(20, snipe);
  check('caster bolts stay physical until resist gear', !cultist.dmgType && !bolt.dmgType && !ring.dmgType && !orb.dmgType && !snipe.dmgType && !web.dmgType && !arrow.dmgType && w.__lastDamage.type === 'Physical' && w.__lastDamage.dealt === 10, [bolt.dmgType || 'phys', ring.dmgType || 'phys', orb.dmgType || 'phys', snipe.dmgType || 'phys', w.__lastDamage.dealt].join(','));

  const fakeBoss = foe(g, p, p.x + 70);
  fakeBoss.T = Object.assign({}, fakeBoss.T, { boss: true });
  const bossBolt = w.eShoot(fakeBoss, 0, 40, { kind: 'boss', dmgType: 'Shadow' });
  check('boss shots stay physical', bossBolt && !bossBolt.dmgType, bossBolt && bossBolt.dmgType);

  p = calm(g, w);
  g.startFloor(5, true);
  p = g.player;
  p.hp = 400; p.mp = 80; p.st.def = 0; p.inv0 = 0; p.x = p.x || 200; p.y = p.y || 180;
  const home = g.rooms && g.rooms[0];
  if (home) { p.x = (home.cx + 0.5) * 16; p.y = (home.cy + 0.5) * 16; }
  const tx = Math.floor(p.x / 16), ty = Math.floor(p.y / 16);
  for (let y = -2; y <= 2; y++) for (let x = -1; x <= 8; x++) g.setTile(tx + x, ty + y, 1);
  g.enemies.forEach(e => { if (!(e.T && e.T.boss) && !e.superElite) { e.dead = true; e.hp = 0; } });
  if (g.SE717) g.SE717.dead = false;
  const se = g.seSpawn717('se_arachnex', 'fight');
  se.sePhase = 'fight'; se.x = p.x + 24; se.y = p.y; se.hp = 90; se.shield = 9; se.dead = false;
  const seBolt = w.eShoot(se, 0, 40, { dmgType: 'Lightning' });
  check('super elite shots stay physical', seBolt && !seBolt.dmgType, seBolt && seBolt.dmgType);
  let bossE = g.enemies.find(e => e.T && e.T.boss && e !== se);
  if (!bossE) bossE = g.spawnBoss(p.x + 48, p.y);
  bossE.x = p.x + 48; bossE.y = p.y; bossE.dead = false; bossE.hp = 400; bossE.shield = 200; bossE.hidden = false;
  p.mp = 80; p.lichTome.isAcquired = true; g.unlockSpell('hellmouth');
  w.castHellmouth();
  const sinks = p.activeHellSinks || [];
  check('hellmouth still sinks the super elite and not the boss', sinks.some(s => s.enemyRef === se) && !sinks.some(s => s.enemyRef === bossE));
  for (let i = 0; i < 45; i++) w.tickHellmouth(0.05);
  check('hellmouth still deletes the super elite', se.dead === true || se.hp <= 0 || g.enemies.indexOf(se) < 0, 'hp ' + se.hp);

  const rows = [
    { label: 'fists', dealt: 2, period: 0.45 },
    { label: 'sword', dealt: 4, period: 0.45 },
    { label: 'axe', dealt: 5, period: 0.5 },
    { label: 'staff', dealt: 5, period: 0.45 },
    { label: 'maul', dealt: 19, period: 0.643 },
    { label: 'bow', dealt: 7, period: 0.429 }
  ];
  const weapons = [
    { name: null, spd: 1, pin: 2 },
    { name: 'Short Sword', spd: 1, pin: 4 },
    { name: 'Hand Axe', spd: 0.9, pin: 5 },
    { name: 'Gnarled Staff', spd: 1, pin: 5 },
    { name: 'Great Maul', spd: 0.7, pin: 19 },
    { name: 'BOW', spd: 1.05, pin: 7 }
  ];
  weapons.forEach((row, i) => {
    p = calm(g, w);
    p.st.min = row.pin; p.st.max = row.pin; p.st.crit = 0; p.st.aspd = row.spd; p.st.fire = 0;
    let dealt = 0;
    if (row.name === 'BOW') {
      g.equipBow('default'); p.st.min = row.pin; p.st.max = row.pin; p.st.aspd = row.spd;
      w.fireBow(p.equip.weapon, true);
      const ar = g.projs.filter(q => q.kind === 'arrow' && q.owner === 'p').pop();
      const be = foe(g, p, p.x + 16); be.r = 8;
      if (ar) { ar.x = be.x; ar.y = be.y; ar.life = 0.2; }
      g.step(0.05, { x: 0, y: 0 });
      dealt = loss(be);
    } else {
      if (row.name) p.equip.weapon = g.makeItem(1, 0, row.name);
      p.st.min = row.pin; p.st.max = row.pin; p.st.aspd = row.spd;
      const e = foe(g, p, p.x + 12);
      w.doAttack(true);
      dealt = loss(e);
    }
    const expect = rows[i];
    const sec80 = Math.round(Math.ceil(80 / dealt) * expect.period * 1000) / 1000;
    check(expect.label + ' time to kill unchanged', dealt === expect.dealt && Math.abs(sec80 - Math.round(Math.ceil(80 / expect.dealt) * expect.period * 1000) / 1000) < 1e-6, dealt + ' sec ' + sec80);
  });

  function skillHit(setup, idx, resist) {
    p = calm(g, w);
    setup(p);
    p.cds[idx] = 0; p.mp = 200;
    g.projs.length = 0;
    if (idx === 0) {
      w.castSkill(0);
      const shot = g.projs.find(q => q.kind === 'fire');
      const e = foe(g, p, p.x + 30);
      if (shot) { e.x = shot.x + shot.vx * 0.05; e.y = shot.y; e.r = 8; }
      if (resist) { e.resists = resist; e.maxResist = 15; }
      g.step(0.05, { x: 0, y: 0 });
      return loss(e);
    }
    const e = foe(g, p, idx === 2 ? p.x + 10 : p.x);
    if (resist) { e.resists = resist; e.maxResist = 15; }
    w.castSkill(idx);
    return loss(e);
  }
  const ttk = [
    ['fireball L1', skillHit(p => { p.lvl = 1; p.st.fire = 0; }, 0), 11],
    ['fireball L10', skillHit(p => { p.lvl = 10; p.st.fire = 0; }, 0), 36],
    ['fireball L10 power 20', skillHit(p => { p.lvl = 10; p.st.fire = 20; }, 0), 64],
    ['whirlwind pin 10', skillHit(p => { p.st.min = 10; p.st.max = 10; p.st.crit = 0; }, 1), 15],
    ['whirlwind crit', skillHit(p => { p.st.min = 10; p.st.max = 10; p.st.crit = 100; w.__critRoll = 0; }, 1), 29],
    ['frost L1', skillHit(p => { p.lvl = 1; p.st.fire = 0; }, 2), 8],
    ['frost L10 power 20', skillHit(p => { p.lvl = 10; p.st.fire = 20; }, 2), 50],
    ['fireball against fire resist', skillHit(p => { p.lvl = 10; p.st.fire = 20; }, 0, { Fire: 90 }), 6],
    ['frost against cold resist', skillHit(p => { p.lvl = 1; p.st.fire = 0; }, 2, { Cold: 90 }), 1]
  ];
  ttk.forEach(row => check(row[0] + ' direct hit', row[1] === row[2], row[1]));
  check('crit chance stays uncapped', (p = calm(g, w), p.st.crit = 250, g.critChance('melee') === 250));
  check('curse life drain stays unwired', g.curseHooks(p).lifeDrainWired === false);
}
</script>
