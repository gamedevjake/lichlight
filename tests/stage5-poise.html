<script>
const lines = [];
function check(name, cond, extra) {

}
function finish() {
  const fails = lines.filter(l => l.startsWith('FAIL')).length;
  document.getElementById('out').textContent = lines.join('\n');
  document.title = (fails ? 'FAIL ' + fails : 'PASS') + ' / ' + lines.length;
}
function fetchText(url) {

  catch (e) { return ''; }
}
document.getElementById('g').addEventListener('load', () => {
  try { run(document.getElementById('g').contentWindow); }
  catch (e) { lines.push('FAIL harness :: ' + (e && e.stack || e)); }
  finish();
});
function calm(g, w) {

  const seFr = g.applyStatus(se, 'freeze');
  check('super elite stays freeze immune', seFr.reason === 'immune' && !g.getStatus(se, 'freeze'), seFr.reason);
  se.poise = 1; se.staggerImmune = 0; se.poiseBreaks = 0;
  g.applyPoiseDamage(se, 50);
  check('super elite can still stagger once poise breaks', g.ccImmobilized(se) === 'stagger' && g.getStatus(se, 'stagger').dur <= 0.32 + 1e-6, g.getStatus(se, 'stagger') && g.getStatus(se, 'stagger').dur);

  const crab = foe(g, p, 'crab', p.x + 240);
  crab.mode = 'shell'; crab.hmFreeze = false;
  const crabPoise = crab.poise;
  w.damageEnemy(crab, 20, 0, 0, '#fff', false, null, { type: 'Physical', tags: ['Melee', 'Direct'], skill: 'melee', critApplied: true, scale: false });
  check('crab shell blocks HP and poise', crab.hp === 800 && crab.poise === crabPoise && w.__lastDamage.prevented === 'crab', crab.poise);

  const slowE = foe(g, p, 'rat', p.x + 260);
  slowE.slow = 2;
  check('frost nova slow alone stays 0.45', Math.abs(g.ccMoveMul(slowE) - 0.45) < 1e-6, g.ccMoveMul(slowE));
  slowE.slow = 0; slowE.auraT = 1e9; slowE.auraPct = 40;
  check('chill aura alone stays 0.6', Math.abs(g.ccMoveMul(slowE) - 0.6) < 1e-6, g.ccMoveMul(slowE));
  g.applyStatus(slowE, 'chill', { slowPct: 60, buildup: 0 });
  slowE.slow = 2;
  check('stacked legacy slows floor at 0.2', Math.abs(g.ccMoveMul(slowE) - 0.2) < 1e-6 && g.ccMoveMul(slowE) > 0, g.ccMoveMul(slowE));
  g.applyStatus(slowE, 'freeze', {});
  check('freeze is a real stop below the floor', g.ccMoveMul(slowE) === 0, g.ccMoveMul(slowE));
  boss.slow = 3;
  g.clearStatuses(boss);
  check('boss frost slow stays 0.5', Math.abs(g.ccMoveMul(boss) - 0.5) < 1e-6, g.ccMoveMul(boss));
  se.slow = 3; g.clearStatuses(se); se.staggerImmune = 0;
  check('super elite frost slow stays 0.5 and still ignores the aura', Math.abs(g.seMoveMul(se) - 0.5) < 1e-6, g.seMoveMul(se));
  p.slowT = 3; g.clearStatuses(p); g.resetPoise(p); g.ensurePoise(p);
  check('player brine slow stays 0.6', Math.abs(g.ccMoveMul(p) - 0.6) < 1e-6, g.ccMoveMul(p));
  g.applyStatus(p, 'chill', { slowPct: 60, buildup: 0 });
  const stacked = g.ccMoveMul(p, 0.45 * 0.55);
  check('player web brine chill and water floor at 0.2', Math.abs(stacked - 0.2) < 1e-6, stacked);
  check('move floor is wired into the player step', src.indexOf('ccMoveMul(p, webSlow() * hazSlow())') >= 0);
  g.clearStatuses(slowE); slowE.slow = 2; slowE.auraT = 0;
  check('grid frost alone stays 1.8', Math.abs(g.gridSlowMul(slowE) - 1.8) < 1e-6, g.gridSlowMul(slowE));
  g.applyStatus(slowE, 'chill', { slowPct: 60, buildup: 0 });
  check('grid frost plus chill stays under the cap', Math.abs(g.gridSlowMul(slowE) - 4.5) < 1e-6, g.gridSlowMul(slowE));
  g.clearStatuses(p); p.slowT = 0; p.swing = 0; p.roll = 0;
  const stepX = p.x;
  g.step(0.1, { x: 1, y: 0 });
  const plainStep = p.x - stepX;
  p.x = stepX;
  g.applyStatus(p, 'chill', { slowPct: 50, buildup: 0 });
  g.step(0.1, { x: 1, y: 0 });
  const chillStep = p.x - stepX;
  check('chill alone still halves a step', plainStep > 2 && Math.abs(chillStep / plainStep - 0.5) < 0.08, plainStep + ' -> ' + chillStep);
  p.x = stepX;
  g.applyStatus(p, 'freeze', {});
  g.step(0.1, { x: 1, y: 0 });
  check('freeze holds the player', Math.abs(p.x - stepX) < 0.01, p.x - stepX);
  g.clearStatuses(p); p.freezeImmune = 0; g.tickStatuses(p, 0.01);

  const loop = foe(g, p, 'rat', p.x + 280);
  loop.poiseImmune = 0.4; loop.poiseDur = 0.2;
  let loopLock = 0, loopGap = 0, loopMin = 999, loopMax = 0, loopRun = 0, loopN = 0;
  for (let i = 0; i < 400; i++) {
    g.applyPoiseDamage(loop, 200);
    g.tickStatuses(loop, 0.05);
    loopN++;
    if (g.ccImmobilized(loop)) { loopLock++; loopRun++; if (loopRun > loopMax) loopMax = loopRun; if (loopGap) { if (loopGap < loopMin) loopMin = loopGap; loopGap = 0; } }
    else { loopGap++; loopRun = 0; }
  }
  check('spam cannot permanently disable an enemy', loopMax <= 6 && loopMin >= 7 && loopLock < loopN * 0.45 && loop.poiseBreaks <= 8, 'max ' + loopMax + ' minGap ' + loopMin + ' lock ' + loopLock + '/' + loopN + ' breaks ' + loop.poiseBreaks);

  calm(g, w); p = g.player;
  const bossSrc = foe(g, p, 'skel', p.x + 24);
  bossSrc.T = Object.assign({}, bossSrc.T, { boss: true });
  let pBreak = 0;
  for (let i = 0; i < 8; i++) {
    p.inv0 = 0; p.roll = 0;
    w.hurtPlayer(10, bossSrc);
    if (w.__lastPoise.broke) pBreak = i + 1;
  }
  check('eight boss contacts deal 80 and break on the seventh', p.hp === 320 && pBreak === 7 && Math.abs(22 - g.POISE_IN.heavy) < 1e-6, 'hp ' + p.hp + ' breakAt ' + pBreak);

  g.newGame(); p = calm(g, w);
  const saver = foe(g, p, 'rat', p.x + 18);
  saver.maxHp = 4321; saver.hp = 4321; saver.hmFreeze = true;
  g.applyPoiseDamage(saver, 12);
  const savedPoise = saver.poise;
  g.applyPoiseDamage(p, 30);
  const playerPoise = p.poise;
  w.save();
  g.continueGame();
  p = g.player;
  const back = g.enemies.find(e => e.maxHp === 4321);
  check('save keeps partial poise on the player and the enemy', back && Math.abs(back.poise - savedPoise) < 0.02 && p.poise && Math.abs(p.poise - playerPoise) < 0.02, 'e ' + (back && back.poise) + ' p ' + p.poise);
  const raw = JSON.parse(w.localStorage.getItem('cryptdelve'));
  delete raw.p.poise; delete raw.p.statuses; delete raw.p.freezeImmune;
  w.localStorage.setItem('cryptdelve', JSON.stringify(raw));
  g.continueGame();
  p = g.player;
  g.poiseSanitize(p);
  check('old save without poise loads a full bar', !raw.p.poise && p.poise === p.poiseMax && p.poiseMax === 140 && p.st && p.hp > 0, 'poise ' + p.poise + ' max ' + p.poiseMax);
  p.poiseMax = 999999; p.poise = 999999; p.poiseBreaks = 40;
  g.poiseSanitize(p);
  check('forged poise is clamped', p.poiseMax === 5000 && p.poise === 5000 && p.poiseBreaks <= 8, p.poiseMax + ' breaks ' + p.poiseBreaks);

  const tickE = foe(g, p, 'rat', p.x + 300);
  g.applyStatus(tickE, 'bleed', { base: 10, attacker: 'player' });
  let small = 0;
  for (let i = 0; i < 40; i++) small += g.tickStatuses(tickE, 0.1).ticks.length;
  check('forty small steps tick a 4s bleed four times', small === 4 && !g.getStatus(tickE, 'bleed'), 'ticks ' + small);
  const one = foe(g, p, 'rat', p.x + 320);
  g.applyStatus(one, 'bleed', { base: 10, attacker: 'player' });
  const big = g.tickStatuses(one, 4);
  check('one 4s step matches the small steps', big.ticks.length === 4 && big.expired.indexOf('bleed') >= 0 && big.dropped === 0, 'n ' + big.ticks.length + ' drop ' + big.dropped);
  const huge = foe(g, p, 'rat', p.x + 340);
  g.applyStatus(huge, 'bleed', { base: 10, attacker: 'player' });
  const over = g.tickStatuses(huge, 20);
  const after = g.tickStatuses(huge, 0.05);
  check('a 20s hitch does not duplicate a 4s bleed', over.ticks.length === 4 && over.dropped === 0 && after.ticks.length === 0 && !g.getStatus(huge, 'bleed'), 'n ' + over.ticks.length + ' again ' + after.ticks.length + ' drop ' + over.dropped);
  const fast = foe(g, p, 'rat', p.x + 360);
  fast.statuses = { bleed: { id: 'bleed', key: 'bleed', kind: 'dot', dmgType: 'Physical', interval: 0.25, acc: 0, debt: 0, dur: 40, stacks: [{ base: 1, left: 40, source: { name: 't', kind: 't', id: 't' } }], attacker: 'player', scale: false } };
  const first = g.tickStatuses(fast, 40);
  let caught = first.ticks.length;
  for (let i = 0; i < 20 && (fast.statuses && fast.statuses.bleed); i++) caught += g.tickStatuses(fast, 0.016).ticks.length;
  check('cap keeps a debt and reports the drop', first.ticks.length === 8 && first.dropped === 88 && first.deferred === 64 && caught === 72, 'first ' + first.ticks.length + ' drop ' + first.dropped + ' def ' + first.deferred + ' total ' + caught);

  const crowd = [];
  for (let i = 0; i < 40; i++) crowd.push(foe(g, p, 'rat', p.x + 400 + i));
  const t0 = performance.now();
  for (let n = 0; n < 90; n++) for (let i = 0; i < crowd.length; i++) g.tickStatuses(crowd[i], 0.016);
  const ms = performance.now() - t0;
  let grew = false;
  for (let i = 0; i < crowd.length; i++) {
    const keys = crowd[i].statuses ? Object.keys(crowd[i].statuses).length : 0;
    if (keys > 8 || crowd[i].poiseBreaks > 8) grew = true;
  }
  check('poise ticks stay bounded', !grew && ms < 1500, 'ms ' + Math.round(ms) + ' grew ' + grew);

  g.applyStatus(p, 'curse', { curseId: 'hex', lifeDrain: 10, outPenalty: 0 });
  check('curse life drain is stored and not healed', g.curseHooks(p).lifeDrain === 10 && g.curseHooks(p).lifeDrainWired === false, JSON.stringify(g.curseHooks(p)));
  p.st.ls = 50; p.st.maxHp = 800; p.hp = 100;
  const leech = w.leech(10, 'melee');
  check('life steal is unchanged', leech.healed === 5 && leech.base === 10, JSON.stringify(leech));
  p.st.crit = 250;
  check('crit chance stays uncapped', g.critChance('melee') === 250, g.critChance('melee'));

  check('no stage 6 weapon pass', src.indexOf('function weaponIdentity') < 0 && src.indexOf('HAMMER_POISE') < 0);
}
</script>
