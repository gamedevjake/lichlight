  });
  check('mixed components armor once', p.hp === 250, p.hp);

  const beforeEdges = g.getConversionEdges();
  check('conversion starts empty', beforeEdges.length === 0);
  let selfErr = '', cycleErr = '';
  try { g.setConversionEdges([{ from: 'Fire', to: 'Fire', fraction: 0.5 }]); } catch (e) { selfErr = String(e.message || e); }
  try { g.setConversionEdges([{ from: 'Physical', to: 'Fire', fraction: 0.5 }, { from: 'Fire', to: 'Physical', fraction: 0.5 }]); } catch (e) { cycleErr = String(e.message || e); }
  check('self-edge rejected', selfErr.indexOf('self-edge') >= 0 && g.getConversionEdges().length === 0, selfErr);
  check('cycle rejected', cycleErr.indexOf('cycle') >= 0 && g.getConversionEdges().length === 0, cycleErr);
  g.setConversionEdges([{ from: 'Physical', to: 'Cold', fraction: 0.25 }]);
  try { g.setConversionEdges([{ from: 'Cold', to: 'Lightning', fraction: 1 }, { from: 'Lightning', to: 'Cold', fraction: 1 }]); } catch (e) {}
  check('failed set keeps previous edges', g.getConversionEdges().length === 1 && g.getConversionEdges()[0].to === 'Cold');
  g.setConversionEdges([
    { from: 'Physical', to: 'Fire', fraction: 0.5 },
    { from: 'Fire', to: 'Cold', fraction: 1 }
  ]);
  g.enemies.forEach(e => { e.dead = true; e.hp = 0; });
  const conv = g.spawnEnemy('rat', p.x + 30, p.y, false);
  conv.dead = false; conv.hp = 500; conv.shield = 0; conv.hidden = false; conv.downT = 0; conv.mawVuln = 0; conv.resists = null;
  const convRes = w.damageEnemy(conv, 100, 0, 0, '#fff', false);
  const byType = {};
  (convRes.components || []).forEach(c => { byType[c.type] = (byType[c.type] || 0) + c.amount; });
  check('conversion does not chain or change total', conv.hp === 400 && byType.Physical === 50 && byType.Fire === 50 && !byType.Cold, JSON.stringify(byType));
  conv.hp = 500;
  const fireRes = g.resolveDamage(conv, { amount: 80, type: 'Fire', tags: ['Spell'], attacker: 'player' });
  const fireTypes = {};
  (fireRes.components || []).forEach(c => { fireTypes[c.type] = (fireTypes[c.type] || 0) + c.amount; });
  check('original fire still converts', conv.hp === 420 && fireTypes.Cold === 80 && !fireTypes.Fire, JSON.stringify(fireTypes) + ' hp ' + conv.hp);
  g.setConversionEdges([]);
  check('edges cleared', g.getConversionEdges().length === 0);

  boot();
  p.hp = 30; p.st.maxHp = 100;
  const killed = w.envHurt(50, 'lava', true, '#ff7030', 'fire');
  check('lethal env still kills', killed === true && p.hp === 0, 'hp ' + p.hp + ' ' + killed);
}
</script>
