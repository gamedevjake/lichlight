  const n0 = g.enemies.filter(o => o.hp > 0 && !o.dead).length;
  g.step(0.05, { x: 0, y: 0 });
  check('harbinger telegraphs before the rat', harb.affix.call > 0 && g.enemies.filter(o => o.hp > 0 && !o.dead).length === n0, 'call ' + harb.affix.call);
  g.step(g.AFFIX_CALL_TELL + 0.05, { x: 0, y: 0 });
  const rats = g.enemies.filter(o => o.type === 'rat' && o.minion && o.owner === harb.id && o.hp > 0);
  check('harbinger summons one unaffixed rat', rats.length === 1 && !rats[0].affix && !rats[0].elite, rats.length + ' affix ' + (rats[0] && rats[0].affix));
  harb.affix.call = 0; harb.affix.callCd = 0.01;
  g.step(0.05, { x: 0, y: 0 });
  g.step(g.AFFIX_CALL_TELL + 0.05, { x: 0, y: 0 });
  harb.affix.call = 0; harb.affix.callCd = 0.01;
  g.step(0.05, { x: 0, y: 0 });
  g.step(g.AFFIX_CALL_TELL + 0.05, { x: 0, y: 0 });
  const rats2 = g.enemies.filter(o => o.type === 'rat' && o.minion && o.owner === harb.id && o.hp > 0);
  check('harbinger stops at two rats', rats2.length === 2, rats2.length);

  p = calm(g, w);
  const burnE = foe(g, 'ooze', p.x + 16, p.y, false);
  g.applyStatus(burnE, 'burning', { base: 10, attacker: 'player', source: { name: 'Kindling', kind: 'skill', id: 'k' } });
  const bt = g.tickStatuses(burnE, 1);
  const burnDealt = (bt.ticks || []).reduce((n, t) => n + (t.dealt || 0), 0);
  check('burn is resisted once', burnDealt === 8 && burnE.hp === 492, burnDealt + ' hp ' + burnE.hp);
  const poiseE = foe(g, 'skel', p.x + 20, p.y, false);
  const pz = poiseE.poise;
  g.damageEnemy(poiseE, 100, 0, 0, '#fff', false, null, { type: 'Fire', tags: ['Spell', 'AoE'], skill: 'fireball', poiseClass: 'skill', critApplied: true, scale: false });
  check('resist does not change poise', poiseE.hp === 370 && Math.abs(pz - poiseE.poise - 14) < 1e-6, 'hp ' + poiseE.hp + ' poise ' + (pz - poiseE.poise));

  p = calm(g, w);
  park(g, p);
  const crab = g.spawnEnemy('crab', p.x + 4, p.y, false, { noAffix: true });
  crab.dead = false; crab.hidden = false; crab.atkCd = 0; crab.mode = 'shell';
  stick(crab, p, 4); crab.mode = 'shell';
  g.enemies.forEach(o => { if (o !== crab) { o.dead = true; o.hp = 0; } });
  p.hp = 400; p.st.def = 0; p.inv0 = 0;
  g.step(0.25, { x: 0, y: 0 });
  const shelled = p.hp;
  check('shelled crab still bites', crab.mode === 'shell' && shelled < 400, p.hp + ' mode ' + crab.mode);
  const shellHp = crab.hp;
  g.damageEnemy(crab, 40, 0, 0, '#fff', false);
  check('shelled crab still blocks incoming damage', crab.hp === shellHp && w.__lastDamage && w.__lastDamage.prevented === 'crab', crab.hp + ' ' + (w.__lastDamage && w.__lastDamage.prevented));
  crab.mode = 'open'; crab.atkCd = 0; stick(crab, p, 4); crab.mode = 'open'; p.inv0 = 0;
  if (crab.ai) crab.ai.engagedUntil = 1e15;
  g.step(0.25, { x: 0, y: 0 });
  check('open crab still does not bite', crab.mode === 'open' && p.hp === shelled, p.hp + ' mode ' + crab.mode);

  p = calm(g, w);
  w.__eliteDepth = 12; w.__affixRolls = [0, 0];
  const saved = g.spawnEnemy('skel', p.x, p.y, true);
  saved._mark = 's8'; saved.hp = 17;
  const savedIds = saved.affix.ids.join(','), savedFire = saved.resists.Fire;
  w.save();
  g.continueGame();
  let back = g.enemies.find(e => e._mark === 's8');
  check('save keeps the affix and the resist profile', back && back.affix && back.affix.ids.join(',') === savedIds && back.resists.Fire === savedFire && back.hp === 17, back && (back.affix && back.affix.ids.join(',') + ' hp ' + back.hp));
  if (back) { back.affix = null; back.resists = null; back.resistTag = ''; }
  w.save();
  g.continueGame();
  back = g.player && g.enemies.find(e => e._mark === 's8');
  check('an old snapshot regains resists and does not grow an affix', back && back.resists && back.resists.Fire === -30 && !back.affix, back && (back.resists && back.resists.Fire) + ' affix ' + (back && back.affix));

  p = calm(g, w);
  p.st.def = 30; p.hp = 300; p.inv0 = 0;
  const mage = g.spawnEnemy('mage', p.x + 80, p.y, false);
  const cultist = w.eShoot(mage, 0, 90, { label: mage.T.label });
  w.hurtPlayer(20, cultist);
  check('cultist bolt is shadow', cultist && cultist.dmgType === 'Shadow' && w.__lastDamage.type === 'Shadow' && w.__lastDamage.dealt === 20, (cultist && cultist.dmgType) + ' ' + (w.__lastDamage && w.__lastDamage.dealt));

  g.startFloor(5, true);
  p = g.player;
  p.hp = 400; p.st.maxHp = 400; p.st.def = 0; p.mp = 80; p.inv0 = 0; p.lichTome.isAcquired = true;
  g.unlockSpell('hellmouth');
  w.__hurtSpread = 1;
  const home = g.rooms && g.rooms[0];
  if (home) { p.x = (home.cx + 0.5) * 16; p.y = (home.cy + 0.5) * 16; }
  g.enemies.forEach(e => { if (!(e.T && e.T.boss) && !e.superElite) { e.dead = true; e.hp = 0; e.x = 8; e.y = 8; } });
  const se2 = g.seSpawn717('se_bonewarden', 'fight');
  se2.x = p.x + 20; se2.y = p.y; se2.hp = 80; se2.dead = false; se2.hidden = false;
  const shieldOpen = se2.shield;
  const shieldOfLife = Math.round(g.seMaxHp717(g.depth) * g.SE_SHIELD_FRAC);
  let bite = Math.round(shieldOpen * g.HM_BITE);
  if (bite < 1) bite = 1;
  if (bite > shieldOpen) bite = shieldOpen;
  let boss2 = g.enemies.find(e => e.T && e.T.boss && e !== se2);
  if (!boss2) boss2 = g.spawnBoss(p.x + 48, p.y);
  boss2.x = p.x + 48; boss2.y = p.y; boss2.dead = false; boss2.hp = 300; boss2.maxHp = 300; boss2.shield = 80; boss2.mawVuln = 0;
  p.mp = 80; p.lichTome.isAcquired = true; g.unlockSpell('hellmouth');
  w.castHellmouth();
  const sinks = p.activeHellSinks || [];
  check('hellmouth does not sink a gate encounter', !sinks.some(s => s.enemyRef === se2) && !sinks.some(s => s.enemyRef === boss2));
  for (let i = 0; i < 45; i++) w.tickHellmouth(0.05);
  check('hellmouth does not delete the super elite', se2.dead !== true && se2.hp === 80 && shieldOpen === shieldOfLife && shieldOpen > bite && se2.shield === shieldOpen - bite && g.enemies.indexOf(se2) >= 0, 'hp ' + se2.hp + ' sh ' + se2.shield + ' from ' + shieldOpen);
}
</script>
