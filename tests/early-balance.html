  const powHits = lives.map(L => hits(L, 19));
  const brHits = lives.map(L => hits(L, 13));
  check('powers of 19 to die on the measured life band', powHits.join(',') === '4,4,5,6,6,11', powHits.join(','));
  check('brands of 13 to die on the measured life band', brHits.join(',') === '6,6,7,8,9,16', brHits.join(','));
  g.startFloor(1, true); p = calm(g, w); p.st.def = 7; p.hp = 200;
  if (g.SE717) { g.SE717.dead = false; g.SE717.alive = true; }
  const arm = g.seSpawn717('se_morbius', 'fight');
  arm.sePhase = 'fight'; arm.x = p.x; arm.y = p.y;
  g.seResolveTell(arm, 'power', { x: arm.x, y: arm.y, r: 40 });
  check('depth 1 power at defense 7 deals 16', p.hp === 184, 200 - p.hp);

  const worn = { id: 41, slot: 'armor', icon: 'armor', base: 'Leather Armor', name: 'Old Mail', rarity: 2, lvl: 3, mods: { hp: 12 }, reqLvl: 1, maxDur: 40, dur: 40 };
  const bagMagic = { id: 42, slot: 'helm', icon: 'helm', base: 'Cap', name: 'Old Cap', rarity: 1, lvl: 3, mods: { def: 1 }, maxDur: 20, dur: 20 };
  const bagRare = { id: 43, slot: 'boots', icon: 'boots', base: 'Boots', name: 'Old Boots', rarity: 2, lvl: 3, mods: {}, reqLvl: 1, maxDur: 20, dur: 20 };
  const save = {
    depth: 1, itemId: 80,
    p: {
      lvl: 1, xp: 0, gold: 15, hp: 60, mp: 25, hpPot: 3, mpPot: 2, keys: 0, rpPot: 0,
      kills: 1, found: [], gateKeys: 0, rations: 2, hunger: 100, thirst: 100, fatigue: 100,
      learned: [false, false, false],
      inv: [bagMagic, bagRare],
      equip: { weapon: null, shield: null, helm: null, armor: worn, boots: null, ring: null, amulet: null }
    }
  };
  localStorage.setItem('cryptdelve', JSON.stringify(save));
  g.continueGame();
  p = g.player;
  const still = p.equip.armor;
  check('legacy equipped rare stays worn at level 1', p.lvl === 1 && still && still.id === 41 && still.reqLvl === 1 && still.reqSrc === 'grandfather' && p.inv.indexOf(still) < 0, still && (still.reqLvl + ' ' + still.reqSrc));
  const mag = p.inv.filter(Boolean).find(it => it.id === 42);
  const boots = p.inv.filter(Boolean).find(it => it.id === 43);
  check('owned items with no stored requirement get the old shortcut', mag && mag.reqLvl === 1 && mag.reqSrc === 'grandfather' && g.calcReqLvl(mag) === 2, mag && (mag.reqLvl + ' new ' + g.calcReqLvl(mag)));
  check('a stored requirement is not raised', boots && boots.reqLvl === 1 && boots.reqSrc === 'grandfather' && w.canWear(boots));
  const idx = p.inv.indexOf(still);
  w.unequipSlot('armor');
  const held = p.inv.filter(Boolean).find(it => it.id === 41);
  const heldAt = p.inv.indexOf(held);
  check('unequip keeps the grandfathered rare', !p.equip.armor && held && held.reqLvl === 1, held && held.reqLvl);
  const wore = w.equipFrom(heldAt);
  check('re-equip of a grandfathered item succeeds below the new requirement', p.equip.armor && p.equip.armor.id === 41 && wore !== false, p.equip.armor && p.equip.armor.reqLvl);
  w.unequipSlot('armor');
  const fresh = w.makeItem(3, 2, 'Leather Armor');
  const slot = p.inv.indexOf(null);
  p.inv[slot] = fresh;
  p.lvl = 1; w.computeStats();
  const blocked = w.equipFrom(slot);
  check('a new item level 3 rare cannot be equipped at level 1 or 2', blocked === false && !p.equip.armor && fresh.reqLvl === 3 && fresh.reqSrc === 'drop');
  p.lvl = 2; w.computeStats();
  check('level 2 still cannot wear the new rare', w.equipFrom(slot) === false && !p.equip.armor);
  p.lvl = 3; w.computeStats();
  w.equipFrom(slot);
  check('level 3 can equip the new rare', p.equip.armor && p.equip.armor.id === fresh.id, p.equip.armor && p.equip.armor.reqLvl);
  const cap = w.makeItem(3, 1, 'Cap');
  const capAt = p.inv.indexOf(null); p.inv[capAt] = cap;
  p.lvl = 1; w.computeStats();
  check('a new item level 3 magic requires 2', cap.reqLvl === 2 && w.equipFrom(capAt) === false && !p.equip.helm);
  p.lvl = 2; w.computeStats(); w.equipFrom(capAt);
  check('level 2 can equip the new magic', p.equip.helm && p.equip.helm.id === cap.id);
  const white = w.makeItem(3, 0, 'Boots');
  check('a new white of item level 3 still requires 1', white.reqLvl === 1 && w.canWear(white));

  g.newGame();
  const onFloor = w.makeItem(3, 2, 'Leather Armor');
  onFloor.id = 501; onFloor.name = 'Floor Rare'; delete onFloor.reqLvl; delete onFloor.reqSrc;
  const dropped = w.makeItem(3, 2, 'Leather Armor');
  dropped.id = 502;
  const pile = (item, dx) => {
    const o = w.Object.create(w.Object.prototype);
    o.x = g.player.x + dx; o.y = g.player.y; o.item = item; o.bob = 0; o.lock = true;
    g.ground.push(o);
  };
  pile(onFloor, 6); pile(dropped, -6);
  w.save();
  g.continueGame();
  const backFloor = (g.ground || []).filter(it => it && it.item).map(it => it.item);
  const oldFloor = backFloor.find(it => it.id === 501);
  const newFloor = backFloor.find(it => it.id === 502);
  check('saved floor loot is grandfathered and a new drop keeps the new requirement', oldFloor && oldFloor.reqLvl === 1 && oldFloor.reqSrc === 'grandfather' && newFloor && newFloor.reqLvl === 3 && newFloor.reqSrc === 'drop', (oldFloor && oldFloor.reqLvl + ' ' + oldFloor.reqSrc) + ' / ' + (newFloor && newFloor.reqLvl + ' ' + newFloor.reqSrc));

  finish();
}
</script>
