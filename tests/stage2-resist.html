const lines = [];
function check(name, cond, extra) {

}

  document.title = (fails ? 'FAIL ' + fails : 'PASS') + ' / ' + lines.length;
}
function fetchText(url) {

  catch (e) { return ''; }
}
document.getElementById('g').addEventListener('load', () => {
  try { run(document.getElementById('g').contentWindow); }
  catch (e) { lines.push('FAIL harness :: ' + (e && e.stack || e)); }
  finish();
});
function specDealt(amount, res, maxBonus, pen, spread, eth) {
  if (eth) amount *= 0.75;
  const cap = Math.max(0, Math.min(90, 75 + maxBonus));
  const eff = Math.max(-100, Math.min(cap, res - pen));
  return Math.max(1, Math.round(amount * (100 - eff) / 100 * spread));
}

  p.st.maxResist = 0;
  p.st.penFire = p.st.penCold = p.st.penLightning = p.st.penPoison = p.st.penShadow = 0;
  p.st.powers = [];
  p.resists = null; p.resAll = 0; p.maxResist = 0;

  return p;
}

}

  w.computeStats();
  check('sheet folds all-resist and keeps fire as power', p.st.fire === 6 && p.st.crit === 7 && p.st.resFire === 25 && p.st.resCold === 5 && p.st.resShadow === 5 && p.st.maxResist === 3 && p.st.penFire === 5 && p.st.penCold === 1, JSON.stringify({ fire: p.st.fire, resFire: p.st.resFire, penFire: p.st.penFire, max: p.st.maxResist }));
  check('folded resist is not applied twice', g.elementalResistPercent(p, 'Fire') === 25 && g.elementalResistPercent(p, 'Cold') === 5);
  w.save();
  g.continueGame();
  w.computeStats();
  const q = g.player;
  check('save round trip keeps fire and resists', q && q.st.fire === 6 && q.st.resFire === 25 && q.st.resPoison === 5 && q.st.maxResist === 3 && q.st.penFire === 5 && q.equip.amulet && q.equip.amulet.mods.fire === 6 && q.equip.amulet.mods.resFire === 20 && q.equip.amulet.mods.resAll === 5, q && JSON.stringify({ fire: q.st.fire, resFire: q.st.resFire, penFire: q.st.penFire }));
  q.equip.amulet = { id: 'old-charm', slot: 'amulet', name: 'Old Charm', mods: { fire: 6 }, powers: [] };
  w.computeStats();
  check('old gear has zero resists', q.st.fire === 6 && q.st.resFire === 0 && q.st.resCold === 0 && q.st.penFire === 0 && q.st.maxResist === 0, JSON.stringify({ fire: q.st.fire, resFire: q.st.resFire }));

  g.newGame(); p = calm(g, w);
  p.lichTome.isAcquired = true;
  g.unlockSpell('fireball'); g.unlockSpell('spin'); g.unlockSpell('frostNova');
  p.lvl = 10; p.st.fire = 20; p.mp = 100; p.cds[0] = 0; p.fx = 1; p.fy = 0;
  g.projs.length = 0;
  g.enemies.forEach(e => { e.dead = true; e.hp = 0; });
  w.castSkill(0);
  const fb = g.projs.find(pr => pr.kind === 'fire');
  const burn = g.spawnEnemy('rat', fb.x + fb.vx * 0.05, fb.y + fb.vy * 0.05, false);
  burn.dead = false; burn.hp = 500; burn.hidden = false; burn.downT = 0; burn.spd = 0; burn.hmFreeze = true;
  burn.resists = { Fire: 90 }; burn.maxResist = 15;
  g.step(0.05, { x: 0, y: 0 });
  check('fireball stays physical against fire resist', fb && Math.abs(fb.dmg - 64) < 1e-6 && burn.hp === 436, 'dmg ' + (fb && fb.dmg) + ' hp ' + burn.hp + ' type ' + (w.__lastDamage && w.__lastDamage.type));

  calm(g, w);
  p.lichTome.isAcquired = true; g.unlockSpell('frostNova');
  p.lvl = 1; p.st.fire = 0; p.mp = 80; p.cds[2] = 0;
  g.enemies.forEach(e => { e.dead = true; e.hp = 0; });
  const novaE = g.spawnEnemy('rat', p.x + 10, p.y, false);
  novaE.dead = false; novaE.hp = 100; novaE.hidden = false; novaE.downT = 0; novaE.resists = { Cold: 90 }; novaE.maxResist = 15;
  w.castSkill(2);
  check('frost nova stays physical', novaE.hp === 92 && w.__lastDamage && w.__lastDamage.type === 'Physical', 'hp ' + novaE.hp + ' ' + (w.__lastDamage && w.__lastDamage.type));

  calm(g, w);
  p.lvl = 1; p.st.min = 4; p.st.max = 4; p.st.crit = 0; p.st.fire = 40; p.st.aspd = 1;
  check('melee roll ignores fire and resist stats', w.rollDmg().d === 4);

  g.newGame();
  g.startFloor(5, true);
  p = calm(g, w);
  const home = g.rooms && g.rooms[0];
  if (home) { p.x = (home.cx + 0.5) * 16; p.y = (home.cy + 0.5) * 16; }
  const tx = Math.floor(p.x / 16), ty = Math.floor(p.y / 16);
  for (let y = -2; y <= 2; y++) for (let x = -1; x <= 8; x++) g.setTile(tx + x, ty + y, 1);
  g.enemies.forEach(e => { if (!(e.T && e.T.boss) && !e.superElite) { e.dead = true; e.hp = 0; e.x = 8; e.y = 8; } });
  if (g.SE717) g.SE717.dead = false;
  const se = g.seSpawn717('se_arachnex', 'fight');
  se.sePhase = 'fight'; se.x = p.x + 24; se.y = p.y; se.hp = 90; se.shield = 9; se.mawVuln = 0; se.dead = false; se.hidden = false; se.downT = 0;
  se.resists = { Fire: 90 };
  let boss = g.enemies.find(e => e.T && e.T.boss && e !== se);
  if (!boss) boss = g.spawnBoss(p.x + 48, p.y);
  boss.x = p.x + 48; boss.y = p.y; boss.dead = false; boss.hp = 400; boss.maxHp = 400; boss.shield = 200; boss.mawVuln = 0; boss.hidden = false;
  p.mp = 80; p.lichTome.isAcquired = true; g.unlockSpell('hellmouth');
  w.castHellmouth();
  const sinks = p.activeHellSinks || [];
  check('hellmouth sinks se not boss', sinks.some(s => s.enemyRef === se) && !sinks.some(s => s.enemyRef === boss), 'n ' + sinks.length);
  check('hellmouth vuln is boss only', (boss.mawVuln || 0) >= 3 && !(se.mawVuln > 0));
  const sh0 = boss.shield;
  w.damageEnemy(boss, 100, 0, 0, '#fff', false);
  check('marked boss still takes 110', boss.shield === sh0 - 110 && boss.hp === 400, 'sh ' + boss.shield);
  for (let i = 0; i < 45; i++) w.tickHellmouth(0.05);
  check('hellmouth still deletes se', se.dead === true || se.hp <= 0 || g.enemies.indexOf(se) < 0, 'hp ' + se.hp + ' dead ' + se.dead);

  g.setConversionEdges([{ from: 'Physical', to: 'Fire', fraction: 0.5 }]);
  g.enemies.forEach(e => { e.dead = true; e.hp = 0; });
  const conv = g.spawnEnemy('rat', p.x + 30, p.y, false);
  conv.dead = false; conv.hp = 500; conv.shield = 0; conv.hidden = false; conv.downT = 0; conv.mawVuln = 0;
  conv.resists = { Fire: 50 };
  w.damageEnemy(conv, 100, 0, 0, '#fff', false);
  check('converted fire is resisted once', conv.hp === 425, conv.hp);
  g.setConversionEdges([]);
  check('edges cleared', g.getConversionEdges().length === 0);
}
</script>
