<!DOCTYPE html>
<!-- Headless equipment-drop measurement. Does not change the game. Generates floors and calls live kill/chest/secret functions. -->
<html>
<head><meta charset="utf-8"><title>loot-audit</title></head>
<body>
<iframe id="g" src="../../index.html?v=loot-audit" style="width:960px;height:540px;border:0"></iframe>
<pre id="out">running</pre>
<script>
document.getElementById('g').addEventListener('load', () => {
  try { run(document.getElementById('g').contentWindow); }
  catch (e) { fail(e); }
});
function fail(e) {
  document.getElementById('out').textContent = JSON.stringify({ error: String(e && e.stack || e) });
  document.title = 'FAIL 1';
}
function r2(n) { return Math.round(n * 100) / 100; }
function r3(n) { return Math.round(n * 1000) / 1000; }
function mulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function blank() {
  return {
    floors: 0, errors: 0,
    enemies: { trash: 0, pack: 0, champion: 0, mimic: 0, boss: 0 },
    structs: { chest: 0, free: 0, wall: 0, crack: 0, passage: 0, puzzle: 0, squeeze: 0, prism: 0, portal: 0, shop: 0, gated: 0 },
    src: {},
    expected: { trash: 0, champion: 0, chest: 0, super: 0, boss: 0, squeeze: 0, puzzle: 0 },
    equipN: []
  };
}
function srcOf(bucket, name) {
  if (!bucket.src[name]) bucket.src[name] = { item: 0, weapon: 0, rar: [0, 0, 0, 0], gold: 0, hp: 0, mp: 0, rp: 0, np: 0, ration: 0, torch: 0, key: 0, gkey: 0, other: 0 };
  return bucket.src[name];
}
function addObj(bucket, name, g) {
  const s = srcOf(bucket, name);
  if (g.gold) s.gold += g.gold;
  if (g.pot === 'hp') s.hp++;
  else if (g.pot === 'mp') s.mp++;
  else if (g.pot === 'rp') s.rp++;
  else if (g.pot === 'np') s.np++;
  else if (g.pot) s.other++;
  if (g.ration) s.ration += g.ration;
  if (g.torch) s.torch++;
  if (g.key) s.key++;
  if (g.gkey) s.gkey++;
  if (g.item) {
    s.item++;
    const r = g.item.rarity | 0;
    if (r >= 0 && r <= 3) s.rar[r]++;
    if (g.item.slot === 'weapon') s.weapon++;
  }
}
function fresh(ground) { return ground.filter(g => g && !g._aud); }
function pull(ground, bucket, name) {
  fresh(ground).forEach(g => { g._aud = 1; addObj(bucket, name, g); });
}
function splitLast(ground, bucket, extra, main) {
  const list = fresh(ground);
  const items = list.filter(g => g.item);
  if (items.length) {
    const last = items[items.length - 1];
    last._aud = 1;
    addObj(bucket, extra, last);
  }
  list.forEach(g => { if (!g._aud) { g._aud = 1; addObj(bucket, main, g); } });
}

const DROP_WHITE = 0.05, GATE_WHITE = 0.35, GATE_CHEST = 0.5, GATE_MAGIC = 0.35, GATE_CHAMP = 0.5, CHAMP_WHITE = 0.2;
function rareP(d) { return Math.min(0.6, 0.15 + d * 0.012); }

function run(w) {
  const g = w.game;
  w.__noSampleSfx = true;
  const N_PLAY = 8, N_PIN = 6;
  const PIN_D = [1, 2, 3, 5, 8, 12];
  const PIN_L = [1, 2, 6];

  function pin(lvl) {
    g.player.lvl = lvl;
    g.player.xp = -1e12;
  }
  function classify(obj, doors) {
    if (obj.rusty || (obj.item && obj.item.rusty)) return 'rusty';
    const tx = Math.floor(obj.x / 16), ty = Math.floor(obj.y / 16);
    for (const d of doors) {
      if (!d || !d.puzzle || !d.rect) continue;
      const R = d.rect;
      if (tx >= R.x && tx < R.x + R.w && ty >= R.y && ty < R.y + R.h) return 'puzzle';
    }
    if (obj.sealed && obj.item) return 'sealed';
    if (obj.item) return 'floor-item';
    return 'floor-other';
  }
  function sweep(bucket, d) {
    const p = g.player;
    const gate = (p.lvl | 0) <= 2;
    const doors = g.doors || [];
    const puzzles = doors.filter(x => x && x.puzzle).length;
    bucket.structs.puzzle += puzzles;
    const keyed = (g.chests || []).filter(c => c && !c.free);
    const free = (g.chests || []).filter(c => c && c.free);
    bucket.structs.chest += keyed.length;
    bucket.structs.free += free.length;
    bucket.structs.wall += (g.secrets || []).filter(s => s && !s.passage && s.kind === 'wall').length;
    bucket.structs.crack += (g.secrets || []).filter(s => s && !s.passage && s.kind !== 'wall').length;
    bucket.structs.passage += (g.secrets || []).filter(s => s && s.passage).length;
    bucket.structs.gated += keyed.filter(c => c.gatedRare).length + (g.secrets || []).filter(s => s && s.gatedRare).length;
    const squeezeN = (g.srooms || []).length;
    bucket.structs.squeeze += squeezeN;
    bucket.structs.prism += (g.gilt || []).filter(c => c && c.prism && !c.open).length;
    if (g.shop) bucket.structs.shop++;
    let trash = 0, pack = 0, champs = 0, mimics = 0, bossN = 0;
    (g.enemies || []).forEach(e => {
      if (!e || e.superElite || (e.T && e.T.boss)) { if (e && e.T && e.T.boss) bossN++; return; }
      if (e.T && e.T.disguise) mimics++;
      else if (e.elite) champs++;
      else if (e.T && e.T.pack) pack++;
      else trash++;
    });
    bucket.enemies.trash += trash;
    bucket.enemies.pack += pack;
    bucket.enemies.champion += champs;
    bucket.enemies.mimic += mimics;
    bucket.enemies.boss += bossN;

    // Expected from the live rates, using this floor's counts. Packs use the /2 roll.
    const whiteMul = gate ? GATE_WHITE : 1;
    bucket.expected.trash += trash * DROP_WHITE * whiteMul + pack * DROP_WHITE * 0.5 * whiteMul + mimics * 1;
    bucket.expected.champion += champs * CHAMP_WHITE * (gate ? GATE_CHAMP : 1);
    const rp = rareP(d);
    keyed.forEach(() => {
      if (!gate) bucket.expected.chest += 1;
      else bucket.expected.chest += GATE_CHEST;
    });
    bucket.expected.super += 1;
    bucket.expected.boss += bossN * 4;
    bucket.expected.squeeze += squeezeN;
    bucket.expected.puzzle += puzzles;
    void rp;

    for (const obj of g.ground || []) {
      if (!obj || obj._aud) continue;
      obj._aud = 1;
      addObj(bucket, classify(obj, doors), obj);
    }

    let guard = 0;
    while (guard++ < 100) {
      const e = (g.enemies || []).find(x => x && x.hp > 0 && !x.dead && !x.superElite && !(x.T && x.T.boss));
      if (!e) break;
      const src = (e.T && e.T.disguise) ? 'mimic' : e.elite ? 'champion' : ((e.T && e.T.pack) || e.type === 'slimelet' ? 'trash-pack' : 'trash');
      w.killEnemy(e);
      pull(g.ground, bucket, src);
    }
    const boss = (g.enemies || []).find(x => x && x.T && x.T.boss && x.hp > 0 && !x.dead);
    if (boss) { w.killEnemy(boss); pull(g.ground, bucket, 'boss'); }
    if (g.SE717) { g.SE717.dead = false; g.SE717.alive = true; }
    w.setState('play');
    const se = g.seSpawn717('se_nyx', 'fight');
    if (se) { w.killEnemy(se); pull(g.ground, bucket, 'super'); }

    p.keys = 40;
    for (const c of (g.chests || []).slice()) {
      if (!c || c.open) continue;
      const gated = !!c.gatedRare;
      w.openChest(c);
      if (gated) splitLast(g.ground, bucket, 'gated', c.free ? 'free-chest' : 'chest');
      else pull(g.ground, bucket, c.free ? 'free-chest' : 'chest');
    }
    for (const s of (g.secrets || []).slice()) {
      if (!s || s.broken) continue;
      const gated = !!s.gatedRare;
      const name = s.passage ? 'passage' : (s.kind === 'wall' ? 'cracked-wall' : 'cracked-floor');
      w.breakSecret(s);
      if (gated) splitLast(g.ground, bucket, 'gated', name);
      else pull(g.ground, bucket, name);
    }
    for (const r of (g.srooms || [])) {
      w.openSecretChest({ open: 0, tx: r.x0 + (r.w >> 1), ty: r.y0 });
      pull(g.ground, bucket, 'squeeze');
    }
    for (const c of (g.gilt || []).slice()) {
      if (!c || c.open) continue;
      w.openSecretChest(c);
      pull(g.ground, bucket, c.prism ? 'prism' : 'portal');
    }
    if (typeof w.breakPropsAt === 'function') { w.breakPropsAt(0, 0, 1e7); pull(g.ground, bucket, 'prop'); }

    let items = 0, weapons = 0;
    Object.keys(bucket.src).forEach(k => { items += bucket.src[k].item; weapons += bucket.src[k].weapon; });
    // equipN stores this floor's new items. Caller passes a delta. Handled outside.
    return { items: items, weapons: weapons };
  }

  function oneFloor(bucket, d, seed, lvl) {
    const before = {};
    Object.keys(bucket.src).forEach(k => { before[k] = bucket.src[k].item; });
    const beforeW = Object.keys(bucket.src).reduce((n, k) => n + bucket.src[k].weapon, 0);
    try {
      w.Math.random = mulberry(seed);
    } catch (e) {}
    g.newGame();
    const p = g.player;
    p.learned = [true, true, true];
    if (lvl != null) pin(lvl);
    g.startFloor(d, true);
    if (lvl != null) pin(lvl);
    try { sweep(bucket, d); }
    catch (e) { bucket.errors++; bucket.err = String(e && e.message || e); }
    bucket.floors++;
    let items = 0, weapons = 0;
    Object.keys(bucket.src).forEach(k => { items += bucket.src[k].item - (before[k] || 0); });
    Object.keys(bucket.src).forEach(k => { weapons += bucket.src[k].weapon; });
    weapons -= beforeW;
    bucket.equipN.push(items);
    return { items: items, weapons: weapons, lvl: g.player.lvl };
  }

  const pinned = {};
  for (const lvl of PIN_L) {
    const by = {};
    for (const d of PIN_D) {
      const bucket = blank();
      for (let i = 0; i < N_PIN; i++) oneFloor(bucket, d, 8000 + d * 100 + i, lvl);
      by[d] = pack(bucket);
    }
    pinned[lvl] = by;
  }

  const runs = [];
  for (let n = 0; n < N_PLAY; n++) {
    try { w.Math.random = mulberry(3000 + n * 97); } catch (e) {}
    g.newGame();
    const p = g.player;
    p.learned = [true, true, true];
    const best = {};
    let overflow = 0, upgrades = 0, seen = 0, weapons = 0;
    const curve = [];
    let fullAt = null;
    for (let d = 1; d <= 12; d++) {
      g.startFloor(d, true);
      const bucket = blank();
      try { sweep(bucket, d); }
      catch (e) { bucket.errors++; }
      let equip = 0, rar = [0, 0, 0, 0], weap = 0, gold = 0, pots = 0;
      Object.keys(bucket.src).forEach(k => {
        const s = bucket.src[k];
        equip += s.item; weap += s.weapon; gold += s.gold; pots += s.hp + s.mp;
        for (let i = 0; i < 4; i++) rar[i] += s.rar[i];
      });
      for (const obj of g.ground || []) {
        if (obj.gold) p.gold += obj.gold;
        if (obj.pot === 'hp') p.hpPot++;
        else if (obj.pot === 'mp') p.mpPot++;
        else if (obj.pot === 'rp') p.rpPot = (p.rpPot || 0) + 1;
        if (obj.ration) p.rations = (p.rations || 0) + obj.ration;
        if (!obj.item) continue;
        seen++;
        if (obj.item.slot === 'weapon') weapons++;
        if (obj.rusty || obj.item.rusty) p.gotRusty = true;
        const sc = (obj.item.slot === 'weapon' ? ((obj.item.min || 0) + (obj.item.max || 0)) : (obj.item.def || obj.item.lvl || 1)) + (obj.item.rarity | 0) * 8;
        if (!(best[obj.item.slot] >= sc)) { best[obj.item.slot] = sc; upgrades++; }
        const slot = p.inv.indexOf(null);
        if (slot >= 0) p.inv[slot] = obj.item;
        else overflow++;
      }
      const filled = p.inv.filter(Boolean).length;
      if (fullAt == null && filled >= 20) fullAt = d;
      curve.push({
        d: d, lvl: p.lvl, filled: filled, overflow: overflow, equip: equip, weapon: weap,
        rar: rar, gold: p.gold, hpPot: p.hpPot, mpPot: p.mpPot, upgrades: upgrades, seen: seen,
        shop: bucket.structs.shop, squeeze: bucket.structs.squeeze, puzzle: bucket.structs.puzzle,
        chest: bucket.structs.chest, trash: bucket.enemies.trash, pack: bucket.enemies.pack, champ: bucket.enemies.champion
      });
    }
    runs.push({ fullAt: fullAt, endLvl: p.lvl, endFilled: p.inv.filter(Boolean).length, overflow: overflow, upgrades: upgrades, seen: seen, weapons: weapons, gold: p.gold, curve: curve });
  }

  const out = {
    version: g.version,
    samples: { play: N_PLAY, pin: N_PIN },
    gate: { lvl: 2, white: GATE_WHITE, chestItem: GATE_CHEST, magic: GATE_MAGIC, champWhite: GATE_CHAMP },
    pinned: pinned,
    play: summarizePlay(runs),
    runs: runs
  };
  document.getElementById('out').textContent = JSON.stringify(out);
  document.title = 'PASS / ' + (N_PLAY + PIN_L.length * PIN_D.length * N_PIN);

  function pack(bucket) {
    const n = bucket.floors || 1;
    const per = {};
    Object.keys(bucket.src).forEach(k => {
      const s = bucket.src[k];
      per[k] = {
        item: r3(s.item / n), weapon: r3(s.weapon / n), rar: s.rar.map(x => r3(x / n)),
        gold: r2(s.gold / n), hp: r3(s.hp / n), mp: r3(s.mp / n), rp: r3(s.rp / n), ration: r3(s.ration / n),
        torch: r3(s.torch / n), key: r3(s.key / n)
      };
    });
    const equip = bucket.equipN.slice();
    const mean = equip.reduce((a, b) => a + b, 0) / (equip.length || 1);
    return {
      floors: bucket.floors, errors: bucket.errors, err: bucket.err || '',
      enemies: scale(bucket.enemies, n), structs: scale(bucket.structs, n),
      expected: scale(bucket.expected, n),
      per: per,
      equipMean: r2(mean),
      equipMin: equip.length ? Math.min.apply(null, equip) : 0,
      equipMax: equip.length ? Math.max.apply(null, equip) : 0
    };
  }
  function scale(obj, n) {
    const o = {};
    Object.keys(obj).forEach(k => { o[k] = r3(obj[k] / n); });
    return o;
  }
  function summarizePlay(runs) {
    const depths = [];
    for (let d = 1; d <= 12; d++) {
      const rows = runs.map(r => r.curve[d - 1]);
      const avg = k => r2(rows.reduce((a, b) => a + b[k], 0) / rows.length);
      const rar = [0, 1, 2, 3].map(i => r2(rows.reduce((a, b) => a + b.rar[i], 0) / rows.length));
      depths.push({
        d: d, lvl: avg('lvl'), equip: avg('equip'), weapon: avg('weapon'), filled: avg('filled'),
        overflow: avg('overflow'), gold: avg('gold'), hpPot: avg('hpPot'), upgrades: avg('upgrades'),
        seen: avg('seen'), rar: rar, chest: avg('chest'), champ: avg('champ'), trash: avg('trash'),
        pack: avg('pack'), squeeze: avg('squeeze'), puzzle: avg('puzzle'), shop: avg('shop')
      });
    }
    const full = runs.map(r => r.fullAt).filter(x => x != null);
    return {
      runs: runs.length,
      fullAtMean: full.length ? r2(full.reduce((a, b) => a + b, 0) / full.length) : null,
      fullAtMin: full.length ? Math.min.apply(null, full) : null,
      fullAtMax: full.length ? Math.max.apply(null, full) : null,
      endLvl: r2(runs.reduce((a, b) => a + b.endLvl, 0) / runs.length),
      endSeen: r2(runs.reduce((a, b) => a + b.seen, 0) / runs.length),
      endWeapons: r2(runs.reduce((a, b) => a + b.weapons, 0) / runs.length),
      endOverflow: r2(runs.reduce((a, b) => a + b.overflow, 0) / runs.length),
      endUpgrades: r2(runs.reduce((a, b) => a + b.upgrades, 0) / runs.length),
      endGold: r2(runs.reduce((a, b) => a + b.gold, 0) / runs.length),
      depths: depths
    };
  }
}
</script>
</body>
</html>
