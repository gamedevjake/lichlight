<!DOCTYPE html>
<!-- Audit-only measurement of PR #42 loot. Does not change the game. -->
<html>
<head><meta charset="utf-8"><title>loot-followup</title></head>
<body>
<iframe id="g" src="../../index.html?v=loot-followup" style="width:960px;height:540px;border:0"></iframe>
<pre id="out">running</pre>
<script>
document.getElementById('g').addEventListener('load', () => {
  try { run(document.getElementById('g').contentWindow); }
  catch (e) { fail(e); }
});
function fail(e) {
  document.getElementById('out').textContent = JSON.stringify({ error: String(e && e.stack || e) });
  document.title = 'FAIL 1';
}
function mulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function scoreOf(it) {
  const base = it.slot === 'weapon' ? ((it.min || 0) + (it.max || 0)) : (it.def || it.lvl || 1);
  return base + ((it.rarity | 0) * 8);
}
function run(w) {
  const g = w.game;
  w.__noSampleSfx = true;
  const gr = w.greaterRare711;
  w.greaterRare711 = function () {
    const it = gr();
    if (it) it._audit = 'puzzle';
    return it;
  };
  const cl = w.chestLoot;
  w.chestLoot = function (d) {
    const it = cl(d);
    if (it && !it._audit) it._audit = 'table';
    return it;
  };
  const N = 8;
  const runs = [];
  for (let n = 0; n < N; n++) {
    w.Math.random = mulberry(3000 + n * 97);
    g.newGame();
    const p = g.player;
    p.learned = [true, true, true];
    const floors = [];
    for (let d = 1; d <= 12; d++) {
      g.startFloor(d, true);
      const doors = g.doors || [];
      const inRect = (obj, R) => {
        const tx = Math.floor(obj.x / 16), ty = Math.floor(obj.y / 16);
        return tx >= R.x && tx < R.x + R.w && ty >= R.y && ty < R.y + R.h;
      };
      const inPuzzle = (obj) => doors.some(door => door && door.puzzle && door.rect && inRect(obj, door.rect));
      for (const obj of g.ground || []) {
        const it = obj && obj.item;
        if (!it) continue;
        if (obj.rusty || it.rusty) obj._src = 'rusty';
        else if (it._audit === 'puzzle') obj._src = 'puzzle';
        else if (obj.sealed) obj._src = 'sealed';
        else if (inPuzzle(obj)) obj._src = 'vault';
        else if (it._audit === 'table') obj._src = 'loose';
        else obj._src = 'other';
      }
      if (!(g.ground || []).some(obj => obj && obj._src === 'puzzle')) {
        for (const door of doors) {
          if (!door || !door.puzzle || !door.rect) continue;
          const rare = (g.ground || []).find(obj => obj && obj.item && obj._src === 'vault' && inRect(obj, door.rect) && (obj.item.rarity | 0) >= 2);
          if (rare) { rare._src = 'puzzle'; break; }
        }
      }
      function tagNew(src) {
        for (const obj of g.ground || []) if (obj && obj.item && !obj._src) obj._src = src;
      }
      let guard = 0;
      while (guard++ < 400) {
        const e = (g.enemies || []).find(x => x && x.hp > 0 && !x.dead && !x.superElite && !(x.T && x.T.boss));
        if (!e) break;
        const src = (e.T && e.T.disguise) ? 'mimic' : e.elite ? 'champion' : 'trash';
        w.killEnemy(e);
        tagNew(src);
      }
      const boss = (g.enemies || []).find(x => x && x.T && x.T.boss && x.hp > 0 && !x.dead);
      if (boss) { w.killEnemy(boss); tagNew('boss'); }
      if (g.SE717) { g.SE717.dead = false; g.SE717.alive = true; }
      w.setState('play');
      const se = g.seSpawn717('se_nyx', 'fight');
      if (se) { w.killEnemy(se); tagNew('super'); }
      p.keys = 40;
      for (const c of (g.chests || []).slice()) {
        if (!c || c.open) continue;
        w.openChest(c);
        tagNew(c.free ? 'free' : 'keyed');
      }
      for (const s of (g.secrets || []).slice()) {
        if (!s || s.broken) continue;
        w.breakSecret(s);
        tagNew(s.passage ? 'passage' : 'crack');
      }
      for (const c of (g.schests || []).slice()) {
        if (!c || c.open) continue;
        w.openSecretChest(c);
        tagNew('squeeze');
      }
      for (const c of (g.gilt || []).slice()) {
        if (!c || c.open) continue;
        w.openSecretChest(c);
        tagNew(c.prism ? 'prism' : 'portal');
      }
      if (typeof w.breakPropsAt === 'function') { w.breakPropsAt(0, 0, 1e7); tagNew('prop'); }
      tagNew('other');
      let gold = 0;
      const items = [];
      for (const obj of g.ground || []) {
        if (!obj) continue;
        if (obj.gold) gold += obj.gold;
        if (!obj.item) continue;
        const it = obj.item;
        items.push({
          src: obj._src || 'other',
          slot: it.slot || '',
          weapon: it.slot === 'weapon' ? 1 : 0,
          rarity: it.rarity | 0,
          score: scoreOf(it),
          rusty: (obj.rusty || it.rusty) ? 1 : 0
        });
      }
      const shop = g.shop && g.shop.offers ? g.shop.offers.length : 0;
      if (items.some(it => it.rusty)) p.gotRusty = true;
      floors.push({ d: d, lvl: p.lvl | 0, gold: gold, shop: shop, items: items });
    }
    runs.push({ seed: 3000 + n * 97, floors: floors });
  }
  const out = { version: g.version, head: '5363665a5f2eb767647214c02ff9d016c5dfaa68', runs: runs };
  document.getElementById('out').textContent = JSON.stringify(out);
  document.title = 'PASS / ' + runs.length;
}
</script>
</body>
</html>
